<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline · Fieldgrid</title>
  <style>
    body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f3f7f8;color:#173750;font-family:system-ui}
    .card{max-width:360px;margin:20px;padding:30px;border:1px solid #dce7eb;border-radius:20px;background:#fff;text-align:center;box-shadow:0 20px 60px #17375018}
    .logo{display:block;width:180px;max-width:100%;height:auto;margin:0 auto 26px}
    h1{font-size:24px}p{color:#687f8e;line-height:1.55}
    button{min-height:44px;border:0;border-radius:10px;background:#368341;color:#fff;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
    button:focus-visible{outline:2px solid #092848;outline-offset:3px}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/branding/fieldgrid-logo.svg" alt="Fieldgrid" width="462" height="146">
    <h1>Je bent offline</h1>
    <p>Maak opnieuw verbinding om actuele planning en status veilig op te halen. Je werkgegevens worden niet offline opgeslagen.</p>
    <button type="button" onclick="location.reload()">Opnieuw proberen</button>
  </main>
</body>
</html>
