# Isolated local/CI scanner only; production uses clamd-ticket.conf.example.
Foreground yes
LocalSocket /socket/clamd.sock
LocalSocketMode 600
DatabaseDirectory /var/lib/clamav
EnableVersionCommand yes
TemporaryDirectory /tmp
ScanPDF yes
ScanArchive yes
HeuristicAlerts yes
AlertExceedsMax yes
AlertEncryptedDoc yes
StreamMaxLength 10M
MaxFileSize 20M
MaxScanSize 50M
MaxScanTime 20000
MaxRecursion 10
MaxFiles 1000
MaxThreads 2
MaxQueue 4
ReadTimeout 30
CommandReadTimeout 5
ConcurrentDatabaseReload no
LogClean no
LogVerbose no
GenerateMetadataJson no
LeaveTemporaryFiles no
