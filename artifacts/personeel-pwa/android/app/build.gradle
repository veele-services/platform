apply plugin: 'com.android.application'

def signingProperties = new Properties()
def signingPropertiesPath =
    System.getenv('FIELDGRID_ANDROID_SIGNING_PROPERTIES') ?:
    "${System.getProperty('user.home')}/.local/share/fieldgrid-android/signing/android-signing.properties"
def signingPropertiesFile = file(signingPropertiesPath)
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def hasSigningProfile = { String prefix ->
    def complete = ['STORE_FILE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'].every {
        signingProperties.getProperty("${prefix}_${it}")?.trim()
    }
    complete && file(signingProperties.getProperty("${prefix}_STORE_FILE")).exists()
}

def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('release')
}
if (releaseTaskRequested) {
    def missingProfiles = ['VEELE', 'FIELDGRID'].findAll { !hasSigningProfile(it) }
    if (!missingProfiles.isEmpty()) {
        throw new GradleException(
            "Releasebuild gestopt: signingprofiel(en) ontbreken of verwijzen naar een ontbrekende keystore: ${missingProfiles.join(', ')}. " +
            "Configureer FIELDGRID_ANDROID_SIGNING_PROPERTIES."
        )
    }
}

def versionCodeRaw =
    providers.gradleProperty('FIELDGRID_VERSION_CODE').orNull ?:
    System.getenv('FIELDGRID_VERSION_CODE') ?:
    '1'
def versionNameRaw =
    providers.gradleProperty('FIELDGRID_VERSION_NAME').orNull ?:
    System.getenv('FIELDGRID_VERSION_NAME') ?:
    '1.0.0'

if (!(versionCodeRaw ==~ /^[1-9][0-9]*$/)) {
    throw new GradleException('FIELDGRID_VERSION_CODE moet een positief geheel getal zijn.')
}
if (!(versionNameRaw ==~ /^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$/)) {
    throw new GradleException('FIELDGRID_VERSION_NAME moet geldige semantische versie zijn, bijvoorbeeld 1.0.0.')
}

android {
    namespace = "nl.veeleservices.personeel"
    compileSdk = rootProject.ext.compileSdkVersion
    flavorDimensions += "brand"

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(versionCodeRaw)
        versionName versionNameRaw
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
            personnelAppHost: "fieldgrid.nl",
        ]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasSigningProfile('VEELE')) {
            veeleRelease {
                storeFile file(signingProperties.getProperty('VEELE_STORE_FILE'))
                storePassword signingProperties.getProperty('VEELE_STORE_PASSWORD')
                keyAlias signingProperties.getProperty('VEELE_KEY_ALIAS')
                keyPassword signingProperties.getProperty('VEELE_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
            }
        }
        if (hasSigningProfile('FIELDGRID')) {
            fieldgridRelease {
                storeFile file(signingProperties.getProperty('FIELDGRID_STORE_FILE'))
                storePassword signingProperties.getProperty('FIELDGRID_STORE_PASSWORD')
                keyAlias signingProperties.getProperty('FIELDGRID_KEY_ALIAS')
                keyPassword signingProperties.getProperty('FIELDGRID_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    productFlavors {
        veele {
            dimension "brand"
            applicationId "nl.veeleservices.personeel"
            resValue "string", "app_name", "Veele Personeel"
            resValue "string", "title_activity_main", "Veele Personeel"
            resValue "string", "package_name", "nl.veeleservices.personeel"
            resValue "string", "custom_url_scheme", "nl.veeleservices.personeel"
            manifestPlaceholders.personnelAppHost = "veeleservices.fieldgrid.nl"
            if (hasSigningProfile('VEELE')) {
                signingConfig signingConfigs.veeleRelease
            }
        }
        fieldgrid {
            dimension "brand"
            applicationId "nl.fieldgrid.personeel"
            resValue "string", "app_name", "Fieldgrid Personeel"
            resValue "string", "title_activity_main", "Fieldgrid Personeel"
            resValue "string", "package_name", "nl.fieldgrid.personeel"
            resValue "string", "custom_url_scheme", "nl.fieldgrid.personeel"
            manifestPlaceholders.personnelAppHost = "fieldgrid.nl"
            if (hasSigningProfile('FIELDGRID')) {
                signingConfig signingConfigs.fieldgridRelease
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def googleServicesFiles = [
    file('google-services.json'),
    file('src/veele/google-services.json'),
    file('src/fieldgrid/google-services.json'),
]
if (googleServicesFiles.any { it.exists() && it.length() > 0 }) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle(
        "Geen google-services.json gevonden; native FCM-push is bewust niet opgenomen."
    )
}
