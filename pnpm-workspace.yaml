allowBuilds:
  esbuild: true
  unrs-resolver: true

# The registry has no fixed release for GHSA-vfj7-8cjw-p6xm. The local patch is
# the reviewed upstream fix at micromatch/braces#72; a regression test exercises
# the installed transitive copy. Keep the version-based audit exception paired
# with that patch until an official fixed release replaces both.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch

# Fixed release for GHSA-587h-7wmj-h5pm, required by the existing audit gate.
# Vite is transitive through the development-only Vitest runner.
overrides:
  vite: 8.3.3
