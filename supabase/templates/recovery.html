<html lang="nl"><body>
  <h2>Inloggen bij Fieldgrid</h2>
  <p>Je hebt gevraagd om je wachtwoord opnieuw in te stellen. Fieldgrid gebruikt eenmalige e-mailcodes; een wachtwoord is niet nodig.</p>
  <p>Open de inlogpagina van je Fieldgrid-omgeving en vraag daar een nieuwe inlogcode aan.</p>
  <p>Heb je dit niet aangevraagd? Dan hoef je niets te doen.</p>
</body></html>
