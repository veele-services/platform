name: Fieldflow Calm protected contract

on:
  pull_request_target:
    branches:
      - codex/fieldgrid-uiux-master

permissions:
  actions: read
  attestations: read
  contents: read
  pull-requests: read

concurrency:
  group: fieldflow-calm-contract-root-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-contract-root:
    name: Verify Fieldflow Calm contract root
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: fieldflow-calm-contract
    env:
      EXPECTED_REPOSITORY: veele-services/platform
      EXPECTED_BASE_REF: codex/fieldgrid-uiux-master
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REPOSITORY: ${{ github.repository }}
      BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
      CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      FIELDFLOW_CALM_TRUSTED_ROOT_SHA256: ${{ vars.FIELDFLOW_CALM_TRUSTED_ROOT_SHA256 }}
    steps:
      - name: Validate immutable event inputs
        shell: bash
        run: |
          set -euo pipefail

          readonly sha_pattern='^[0-9a-f]{40}$'
          readonly root_pattern='^[0-9a-f]{64}$'
          readonly repository_pattern='^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          readonly integer_pattern='^[1-9][0-9]*$'

          test "$EVENT_NAME" = "pull_request_target"
          test "$EVENT_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$BASE_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$BASE_REF" = "$EXPECTED_BASE_REF"
          [[ "$BASE_SHA" =~ $sha_pattern ]]
          [[ "$CANDIDATE_SHA" =~ $sha_pattern ]]
          test "$BASE_SHA" != "$CANDIDATE_SHA"
          [[ "$CANDIDATE_REPOSITORY" =~ $repository_pattern ]]
          [[ "$PULL_REQUEST_NUMBER" =~ $integer_pattern ]]
          [[ "$FIELDFLOW_CALM_TRUSTED_ROOT_SHA256" =~ $root_pattern ]]

      - name: Checkout trusted base implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.BASE_REPOSITORY }}
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          lfs: false
          submodules: false
          path: trusted
          persist-credentials: false

      # This checkout may come from an attacker-controlled fork. It is unsafe
      # to execute; every later step treats it as inert Git data only.
      - name: Checkout untrusted candidate as inert Git data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.CANDIDATE_REPOSITORY }}
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          lfs: false
          submodules: false
          path: candidate
          persist-credentials: false

      - name: Verify immutable checkouts, ancestry, and blob boundary
        shell: bash
        run: |
          set -euo pipefail

          test ! -L trusted
          test ! -L candidate
          test "$(git -C trusted rev-parse --verify 'HEAD^{commit}')" = "$BASE_SHA"
          test "$(git -C candidate rev-parse --verify 'HEAD^{commit}')" = "$CANDIDATE_SHA"

          git -C candidate fetch --no-tags ../trusted "$BASE_SHA"
          git -C candidate merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"

          validate_tree_modes() {
            local checkout="$1"
            local commit="$2"
            local record
            local metadata
            local mode
            local remainder
            local type
            local path

            while IFS= read -r -d '' record; do
              metadata="${record%%$'\t'*}"
              path="${record#*$'\t'}"
              mode="${metadata%% *}"
              remainder="${metadata#* }"
              type="${remainder%% *}"
              case "$mode:$type" in
                100644:blob | 100755:blob) ;;
                *)
                  printf 'Unsafe Git tree entry in %s: mode=%q type=%q path=%q\n' \
                    "$checkout" "$mode" "$type" "$path" >&2
                  return 1
                  ;;
              esac
            done < <(git -C "$checkout" ls-tree -r -z --full-tree "$commit")
          }

          validate_tree_modes trusted "$BASE_SHA"
          validate_tree_modes candidate "$CANDIDATE_SHA"

          test -z "$(git -C trusted status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"

      - name: Setup pnpm from trusted base
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 11.5.2
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install only trusted-base dependencies
        working-directory: trusted
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm --version)" = "11.5.2"
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Compare candidate against protected external root
        working-directory: trusted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/fieldgrid-fieldflow-calm-handoff.mjs \
            --verify-contract-root \
            --candidate-root ../candidate \
            --candidate-sha "$CANDIDATE_SHA"

  contract-root:
    name: Fieldflow Calm contract root
    if: ${{ always() }}
    needs:
      - verify-contract-root
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful protected verification
        shell: bash
        env:
          VERIFICATION_RESULT: ${{ needs.verify-contract-root.result }}
        run: |
          set -euo pipefail
          test "$VERIFICATION_RESULT" = "success"
