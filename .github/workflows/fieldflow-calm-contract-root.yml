name: Fieldflow Calm protected contract

on:
  pull_request_target:
    branches:
      - codex/fieldgrid-uiux-master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

permissions:
  actions: read
  attestations: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: fieldflow-calm-contract-root-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-contract-root:
    name: Verify Fieldflow Calm contract root
    if: ${{ github.event.pull_request.base.repo.full_name == 'veele-services/platform' && github.event.pull_request.base.ref == 'codex/fieldgrid-uiux-master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: fieldflow-calm-contract
    env:
      EXPECTED_REPOSITORY: veele-services/platform
      EXPECTED_BASE_REF: codex/fieldgrid-uiux-master
      EXPECTED_EXECUTION_BRANCH: main
      EXPECTED_EVENT_REF: refs/heads/main
      EXPECTED_WORKFLOW_PATH: .github/workflows/fieldflow-calm-contract-root.yml
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_REF: ${{ github.ref }}
      EVENT_REPOSITORY: ${{ github.repository }}
      BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      EXECUTOR_WORKFLOW_REF: ${{ github.workflow_ref }}
      EXECUTOR_WORKFLOW_SHA: ${{ github.workflow_sha }}
      FIELDFLOW_CALM_TRUSTED_ROOT_SHA256: ${{ vars.FIELDFLOW_CALM_TRUSTED_ROOT_SHA256 }}
      FIELDFLOW_CALM_PENDING_ROOT_SHA256: ${{ vars.FIELDFLOW_CALM_PENDING_ROOT_SHA256 }}
    steps:
      - name: Validate immutable event and executor inputs
        shell: bash
        run: |
          set -euo pipefail

          readonly sha_pattern='^[0-9a-f]{40}$'
          readonly root_pattern='^[0-9a-f]{64}$'
          readonly integer_pattern='^[1-9][0-9]*$'
          readonly expected_workflow_ref="${EXPECTED_REPOSITORY}/${EXPECTED_WORKFLOW_PATH}@refs/heads/${EXPECTED_EXECUTION_BRANCH}"

          test "$EVENT_NAME" = "pull_request_target"
          case "$EVENT_ACTION" in
            opened | reopened | synchronize | ready_for_review | edited) ;;
            *) exit 1 ;;
          esac
          test "$EVENT_REF" = "$EXPECTED_EVENT_REF"
          test "$EVENT_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$BASE_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$BASE_REF" = "$EXPECTED_BASE_REF"
          test "$EXECUTOR_WORKFLOW_REF" = "$expected_workflow_ref"
          [[ "$EXECUTOR_WORKFLOW_SHA" =~ $sha_pattern ]]
          [[ "$BASE_SHA" =~ $sha_pattern ]]
          [[ "$CANDIDATE_SHA" =~ $sha_pattern ]]
          test "$BASE_SHA" != "$CANDIDATE_SHA"
          [[ "$PULL_REQUEST_NUMBER" =~ $integer_pattern ]]
          [[ "$FIELDFLOW_CALM_TRUSTED_ROOT_SHA256" =~ $root_pattern ]]
          if test -n "$FIELDFLOW_CALM_PENDING_ROOT_SHA256"; then
            [[ "$FIELDFLOW_CALM_PENDING_ROOT_SHA256" =~ $root_pattern ]]
            test "$FIELDFLOW_CALM_PENDING_ROOT_SHA256" != "$FIELDFLOW_CALM_TRUSTED_ROOT_SHA256"
            test "$EVENT_ACTION" = "edited"
          fi

      - name: Checkout main executor identity
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.BASE_REPOSITORY }}
          ref: ${{ env.EXECUTOR_WORKFLOW_SHA }}
          fetch-depth: 1
          lfs: false
          submodules: false
          path: executor
          persist-credentials: false

      - name: Checkout trusted protected base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.BASE_REPOSITORY }}
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          lfs: false
          submodules: false
          path: trusted
          persist-credentials: false

      # The base repository exposes fork and same-repository PR heads through
      # this synthetic ref. Candidate repository coordinates are never trusted.
      - name: Checkout candidate from base-owned PR ref as inert Git data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: ${{ env.BASE_REPOSITORY }}
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          lfs: false
          submodules: false
          path: candidate
          persist-credentials: false

      - name: Verify executor, base, candidate and first PR-ref observation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test ! -L executor
          test ! -L trusted
          test ! -L candidate
          test "$(git -C executor rev-parse --verify 'HEAD^{commit}')" = "$EXECUTOR_WORKFLOW_SHA"
          test "$(git -C trusted rev-parse --verify 'HEAD^{commit}')" = "$BASE_SHA"
          test "$(git -C candidate rev-parse --verify 'HEAD^{commit}')" = "$CANDIDATE_SHA"
          test -z "$(git -C executor status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C trusted status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"

          readonly workflow_path="$EXPECTED_WORKFLOW_PATH"
          test "$(git -C executor rev-parse "HEAD:${workflow_path}")" = \
            "$(git -C trusted rev-parse "HEAD:${workflow_path}")"
          cmp -- "executor/${workflow_path}" "trusted/${workflow_path}"

          git -C candidate merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"
          mapfile -t observed_ref < <(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${BASE_REPOSITORY}/git/ref/pull/${PULL_REQUEST_NUMBER}/head" \
              --jq '.ref, .object.sha'
          )
          test "${observed_ref[0]}" = "refs/pull/${PULL_REQUEST_NUMBER}/head"
          test "${observed_ref[1]}" = "$CANDIDATE_SHA"

          validate_tree() {
            local checkout="$1"
            local commit="$2"
            local record metadata mode remainder type path
            while IFS= read -r -d '' record; do
              metadata="${record%%$'\t'*}"
              path="${record#*$'\t'}"
              mode="${metadata%% *}"
              remainder="${metadata#* }"
              type="${remainder%% *}"
              case "$mode:$type" in
                100644:blob | 100755:blob) ;;
                *)
                  printf 'Unsafe Git tree entry in %s: mode=%q type=%q path=%q\n' \
                    "$checkout" "$mode" "$type" "$path" >&2
                  return 1
                  ;;
              esac
              case "$path" in
                /* | *\\* | *$'\n'* | *$'\r'*)
                  printf 'Unsafe Git path in %s: %q\n' "$checkout" "$path" >&2
                  return 1
                  ;;
              esac
            done < <(git -C "$checkout" ls-tree -r -z --full-tree "$commit")
          }

          validate_tree executor "$EXECUTOR_WORKFLOW_SHA"
          validate_tree trusted "$BASE_SHA"
          validate_tree candidate "$CANDIDATE_SHA"

      - name: Setup pnpm from trusted workflow
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 11.5.2
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install trusted-base dependencies only
        working-directory: trusted
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm --version)" = "11.5.2"
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate normal promotion or externally armed root rotation
        working-directory: trusted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/fieldgrid-fieldflow-calm-handoff.mjs \
            --verify-contract-root \
            --base-sha "$BASE_SHA" \
            --candidate-root ../candidate \
            --candidate-sha "$CANDIDATE_SHA" \
            --pull-request-number "$PULL_REQUEST_NUMBER" \
            --event-name "$EVENT_NAME" \
            --event-action "$EVENT_ACTION"

      - name: Reject a PR-head race after validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t observed_ref < <(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${BASE_REPOSITORY}/git/ref/pull/${PULL_REQUEST_NUMBER}/head" \
              --jq '.ref, .object.sha'
          )
          test "${observed_ref[0]}" = "refs/pull/${PULL_REQUEST_NUMBER}/head"
          test "${observed_ref[1]}" = "$CANDIDATE_SHA"

  contract-root:
    name: Fieldflow Calm contract root
    if: ${{ always() && github.event.pull_request.base.repo.full_name == 'veele-services/platform' && github.event.pull_request.base.ref == 'codex/fieldgrid-uiux-master' }}
    needs:
      - verify-contract-root
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful protected verification
        shell: bash
        env:
          VERIFICATION_RESULT: ${{ needs.verify-contract-root.result }}
        run: |
          set -euo pipefail
          test "$VERIFICATION_RESULT" = "success"
