name: Fieldgrid Deploy Health Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/fieldgrid-deploy-health-gate.yml"
      - "scripts/fieldgrid-atomic-release-activate.sh"
      - "scripts/fieldgrid-deploy-health-gate.sh"
      - "scripts/fieldgrid-test-baseline-differential.mjs"
      - "tests/fieldgrid-deploy-health-gate.test.mjs"
      - "tests/fieldgrid-test-baseline-differential.test.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-differential-health-gate:
    name: Baseline differential health gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deploy health gate shell tests
        run: pnpm fieldgrid:deploy-health-gate:test

      - name: Run Fieldgrid static guard checks
        run: |
          set -euo pipefail
          pnpm fieldgrid:migration-order-check:check
          pnpm fieldgrid:test-layers:check

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run baseline differential root test lane
        run: pnpm fieldgrid:test:baseline-differential

      - name: Upload baseline differential artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldgrid-test-baseline-differential
          path: outputs/fieldgrid-test-baseline-differential/**
          if-no-files-found: error
