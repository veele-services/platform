name: Fieldgrid Deploy Health Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-differential-health-gate:
    name: Baseline differential health gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.2

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deploy health gate shell tests
        run: pnpm fieldgrid:deploy-health-gate:test

      - name: Run Fieldgrid static guard checks
        run: |
          set -euo pipefail
          pnpm fieldgrid:migration-order-check:check
          pnpm fieldgrid:test-layers:check

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run baseline differential root test lane
        run: pnpm fieldgrid:test:baseline-differential

      - name: Upload baseline differential artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fieldgrid-test-baseline-differential
          path: outputs/fieldgrid-test-baseline-differential/**
          if-no-files-found: warn
