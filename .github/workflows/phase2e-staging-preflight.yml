name: Phase 2E Staging Promotion Preflight

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact reviewed and green main SHA"
        required: true
        type: string
      expected_staging_sha:
        description: "Exact current staging SHA and rollback target"
        required: true
        type: string
      confirmation:
        description: "Type phase2e-staging-only"
        required: true
        type: string
      runtime_probe_only:
        description: "Temporary secrets-free runner capability probe"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: veele-staging
  cancel-in-progress: false

jobs:
  runtime-probe:
    name: Secrets-free PostgreSQL 17 runner proof
    if: inputs.runtime_probe_only
    runs-on: [self-hosted, linux, x64, veele]
    timeout-minutes: 10
    steps:
      - name: Checkout probe implementation
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pinned unprivileged PostgreSQL 17
        run: scripts/fieldgrid-setup-postgresql17.sh

      - name: Prove isolated PostgreSQL 17 startup
        run: |
          set -euo pipefail
          probe_root="$(mktemp -d "$RUNNER_TEMP/fieldgrid-postgresql-probe-XXXXXX")"
          socket_dir="$probe_root/socket"
          data_dir="$probe_root/data"
          log_path="$probe_root/postgresql.log"
          mkdir -m 700 "$socket_dir"
          cleanup() {
            pg_ctl --pgdata "$data_dir" --mode fast --wait stop >/dev/null 2>&1 || true
            rm -rf "$probe_root"
          }
          trap cleanup EXIT
          initdb \
            --pgdata "$data_dir" \
            --username postgres \
            --auth-local trust \
            --auth-host trust \
            --encoding UTF8 \
            --no-locale \
            --waldir "$probe_root/wal" \
            -L "$FIELDGRID_POSTGRESQL_SHAREDIR"
          pg_ctl \
            --pgdata "$data_dir" \
            --log "$log_path" \
            --wait \
            start \
            --options "-h '' -k '$socket_dir' -c fsync=off -c synchronous_commit=off -c full_page_writes=off"
          PGHOST="$socket_dir" PGUSER=postgres PGDATABASE=postgres psql \
            --no-psqlrc \
            --set ON_ERROR_STOP=1 \
            --command 'create extension pgcrypto; create extension "uuid-ossp"; select current_setting('\''server_version_num'\'');'

  preflight:
    name: Backup, restore and migration rehearsal
    if: github.ref_name == 'main' && !inputs.runtime_probe_only
    runs-on: [self-hosted, linux, x64, veele]
    timeout-minutes: 60
    environment: staging
    env:
      TARGET_ENVIRONMENT: staging
      APP_ENV: staging
      PHASE2E_CONFIRM: ${{ inputs.confirmation }}
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      EXPECTED_STAGING_SHA: ${{ inputs.expected_staging_sha }}
      STAGING_BASE_DIR: /var/www/veele/staging

      APP_URL: ${{ vars.APP_URL }}
      BACKOFFICE_SERVICE_NAME: ${{ vars.BACKOFFICE_SERVICE_NAME }}
      PERSONEEL_SERVICE_NAME: ${{ vars.PERSONEEL_SERVICE_NAME }}
      KLANT_SERVICE_NAME: ${{ vars.KLANT_SERVICE_NAME }}
      API_SERVICE_NAME: ${{ vars.API_SERVICE_NAME }}
      BACKOFFICE_PORT: ${{ vars.BACKOFFICE_PORT || vars.PORT }}
      PERSONEEL_PORT: ${{ vars.PERSONEEL_PORT }}
      KLANT_PORT: ${{ vars.KLANT_PORT }}
      API_PORT: ${{ vars.API_PORT }}
      BACKOFFICE_PUBLIC_LOGIN_URL: ${{ vars.BACKOFFICE_PUBLIC_LOGIN_URL }}
      PERSONEEL_PUBLIC_HEALTH_URL: ${{ vars.PERSONEEL_PUBLIC_HEALTH_URL }}
      KLANT_PUBLIC_HEALTH_URL: ${{ vars.KLANT_PUBLIC_HEALTH_URL }}
      API_PUBLIC_HEALTH_URL: ${{ vars.API_PUBLIC_HEALTH_URL }}
      API_PUBLIC_ROOT_URL: ${{ vars.API_PUBLIC_ROOT_URL || 'https://staging.fieldgrid.nl/rest/v1/' }}
      PILOT_TENANT_LOGIN_URL: ${{ vars.PILOT_TENANT_LOGIN_URL || 'https://field-demo.fieldgrid.nl/login' }}

    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned unprivileged PostgreSQL 17
        run: scripts/fieldgrid-setup-postgresql17.sh

      - name: Check staging preflight runtime
        run: |
          set -euo pipefail
          node -v
          pnpm -v
          postgres --version
          initdb --version
          pg_restore --version
          systemctl --version

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Validate preflight contract
        run: pnpm fieldgrid:phase2e-staging-preflight:check

      - name: Prove backup, isolated restore, migrations, secrets, routes and rollback target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
          MOLLIE_WEBHOOK_SECRET: ${{ secrets.MOLLIE_WEBHOOK_SECRET }}
          ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
          FIELDGRID_EMAIL_CONFIG_ENCRYPTION_KEY: ${{ secrets.FIELDGRID_EMAIL_CONFIG_ENCRYPTION_KEY }}
          FIELDGRID_CREDENTIAL_RECOVERY_SECRET: ${{ secrets.FIELDGRID_CREDENTIAL_RECOVERY_SECRET }}
        run: |
          set -euo pipefail
          pnpm fieldgrid:phase2e-staging-preflight --run \
            --expected-main "$EXPECTED_MAIN_SHA" \
            --expected-staging "$EXPECTED_STAGING_SHA"

      - name: Upload secret-free preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2e-staging-preflight-${{ github.run_id }}-${{ inputs.expected_main_sha }}
          path: artifacts/phase2e-staging-preflight/
          if-no-files-found: warn
          retention-days: 14
