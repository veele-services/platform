name: Seed Staging Demo Data

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "seed-den-haag" to rebuild the staging demo dataset
        required: true
        type: string
      dry_run:
        description: Roll back after validating the seed script
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  seed:
    name: Seed staging demo dataset
    runs-on: [self-hosted, linux, x64, veele]
    if: ${{ github.ref_name == 'staging' }}
    environment:
      name: staging
    env:
      APP_ENV: staging
      TARGET_ENVIRONMENT: staging
      APP_URL: ${{ vars.APP_URL }}
      EXPECTED_SUPABASE_PROJECT_REF: olyfmekyqozxrbrwwszu
      DATABASE_URL: ${{ secrets.FIELDGRID_RUNTIME_DATABASE_URL }}
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "true"
      PGSSLMODE: verify-full
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      STAGING_SEED_CONFIRM: ${{ inputs.confirm }}

    steps:
      - name: Confirm staging seed
        if: ${{ inputs.confirm != 'seed-den-haag' }}
        run: |
          echo 'Type "seed-den-haag" in the confirm input to run this workflow.'
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned Supabase database root certificate
        env:
          FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64: ${{ secrets.FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64 }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/fieldgrid-supabase-root-${GITHUB_RUN_ID}-${GITHUB_JOB}.crt"
          node scripts/fieldgrid-database-root-cert.mjs \
            --install-from-env FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64 \
            --out "$certificate_path"
          printf 'FIELDGRID_DATABASE_SSL_ROOT_CERT=%s\n' "$certificate_path" >> "$GITHUB_ENV"

      - name: Check runtime
        env:
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          node -v
          pnpm -v
          node scripts/fieldgrid-environment-isolation-preflight.mjs \
            --validate \
            --require-migration-database

      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prod=false

      - name: Validate seed script without committing
        if: ${{ inputs.dry_run == true }}
        env:
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          pnpm --filter @workspace/db run seed:staging-demo:dry-run

      - name: Rebuild staging demo dataset
        if: ${{ inputs.dry_run == false }}
        env:
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          pnpm --filter @workspace/db run seed:staging-demo
