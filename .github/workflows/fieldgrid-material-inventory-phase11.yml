name: Fieldgrid Material Inventory Phase 11

on:
  workflow_dispatch:
    inputs:
      migration_target:
        description: "Optional self-contained dual-target migration smoke"
        required: true
        default: "plan-only"
        type: choice
        options:
          - plan-only
          - local-dual-target

jobs:
  phase11-hardening-contract:
    name: Phase 11 hardening contract
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate phase 11 contract
        run: pnpm run fieldgrid:material-inventory-phase11:check

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Describe selected migration target
        run: |
          echo "Selected migration target: ${{ inputs.migration_target }}"
          echo "The optional smoke uses both local disposable targets and never reads a live database URL."

      - name: Set up pinned unprivileged PostgreSQL 17
        if: ${{ inputs.migration_target != 'plan-only' }}
        run: scripts/fieldgrid-setup-postgresql17.sh

      - name: Optional self-contained dual-target migration smoke
        if: ${{ inputs.migration_target != 'plan-only' }}
        run: node scripts/fieldgrid-local-migration-smoke.mjs --run --out artifacts/migration-smoke
