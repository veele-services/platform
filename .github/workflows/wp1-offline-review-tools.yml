name: Temporary WP1 offline review tools
on:
  push:
    branches: ['codex/continue-wp1-implementation-from-pr-#516']
    paths: ['.github/workflows/wp1-offline-review-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pack installed dependencies and public binaries only
        run: |
          set -euo pipefail
          find . -type d -name node_modules -prune -print0 > "$RUNNER_TEMP/module-paths"
          tar --null -T "$RUNNER_TEMP/module-paths" -czf "$RUNNER_TEMP/modules.tar.gz"
          split -b 200M "$RUNNER_TEMP/modules.tar.gz" "$RUNNER_TEMP/modules.part-"
          mkdir -p "$RUNNER_TEMP/wp1-tools/bin"
          cp "$(command -v node)" "$RUNNER_TEMP/wp1-tools/bin/node"
          cp -a "$(dirname "$(dirname "$(readlink -f "$(command -v pnpm)")")")" "$RUNNER_TEMP/wp1-tools/pnpm"
          docker pull postgres:17
          id=$(docker create postgres:17)
          docker cp "$id:/usr/lib/postgresql/17" "$RUNNER_TEMP/wp1-tools/postgresql"
          docker cp "$id:/usr/share/postgresql/17" "$RUNNER_TEMP/wp1-tools/pgshare"
          docker cp "$id:/usr/lib/x86_64-linux-gnu" "$RUNNER_TEMP/wp1-tools/pg-lib"
          docker rm "$id"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/tools.tar.gz" wp1-tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp1-modules-a
          path: ${{ runner.temp }}/modules.part-aa
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp1-modules-b
          path: ${{ runner.temp }}/modules.part-ab
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp1-modules-c
          path: ${{ runner.temp }}/modules.part-ac
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp1-tool-binaries
          path: ${{ runner.temp }}/tools.tar.gz
          compression-level: 0
          retention-days: 1
