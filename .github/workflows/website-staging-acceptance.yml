name: Website Staging Acceptance

on:
  workflow_dispatch:
    inputs:
      expected_staging_sha:
        description: "Exact deployed staging SHA"
        required: true
        type: string
      confirmation:
        description: "Type website-staging-read-only"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: veele-staging
  cancel-in-progress: false

jobs:
  acceptance:
    name: Managed and custom read-only evidence
    if: >-
      github.ref_name == 'staging' &&
      inputs.confirmation == 'website-staging-read-only'
    runs-on: [self-hosted, linux, x64, veele]
    timeout-minutes: 20
    environment: staging
    env:
      APP_ENV: staging
      TARGET_ENVIRONMENT: staging
      STAGING_BASE_DIR: /var/www/veele/staging
      WEBSITE_STACK_BASE_DIR: /var/www/veele/website-stack-staging
      WEBSITE_PUBLIC_HEALTH_URL: ${{ vars.WEBSITE_PUBLIC_HEALTH_URL }}
      MARKETING_PUBLIC_HEALTH_URL: ${{ vars.MARKETING_PUBLIC_HEALTH_URL }}
      WEBSITE_MANAGED_ACCEPTANCE_URL: ${{ vars.WEBSITE_MANAGED_ACCEPTANCE_URL }}
      WEBSITE_CUSTOM_ACCEPTANCE_URL: ${{ vars.WEBSITE_CUSTOM_ACCEPTANCE_URL }}
      FIELDGRID_CUSTOM_ROUTE_KEY: ${{ vars.FIELDGRID_CUSTOM_ROUTE_KEY }}
      FIELDGRID_CUSTOM_EXPECTED_HOST: ${{ vars.FIELDGRID_CUSTOM_EXPECTED_HOST }}
      EXPECTED_STAGING_SHA: ${{ inputs.expected_staging_sha }}

    steps:
      - name: Checkout exact staging release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable staging ref before repository code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout="$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$EXPECTED_STAGING_SHA"
          test "$checkout" = "$GITHUB_SHA"
          test "$checkout" = "$EXPECTED_STAGING_SHA"
          node --input-type=module -e '
            if (!/^[a-f0-9]{40}$/u.test(process.env.EXPECTED_STAGING_SHA ?? "")) {
              throw new Error("Expected staging SHA is invalid");
            }
            const response = await fetch(
              `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/staging`,
              {
                headers: {
                  Accept: "application/vnd.github+json",
                  Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  "X-GitHub-Api-Version": "2022-11-28",
                },
              },
            );
            if (!response.ok) {
              throw new Error(`staging ref lookup failed with HTTP ${response.status}`);
            }
            const sha = (await response.json()).object?.sha ?? "";
            if (sha !== process.env.EXPECTED_STAGING_SHA) {
              throw new Error("Expected SHA is not the exact remote staging head");
            }
          '

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Validate acceptance contract
        run: pnpm fieldgrid:website-staging-acceptance:check

      - name: Collect read-only managed and custom evidence
        run: |
          set -euo pipefail
          pnpm fieldgrid:website-staging-acceptance --run \
            --expected-staging "$EXPECTED_STAGING_SHA" \
            --website-health "$WEBSITE_PUBLIC_HEALTH_URL" \
            --marketing-health "$MARKETING_PUBLIC_HEALTH_URL" \
            --managed-url "$WEBSITE_MANAGED_ACCEPTANCE_URL" \
            --custom-url "$WEBSITE_CUSTOM_ACCEPTANCE_URL"

      - name: Upload secret-free acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-staging-acceptance-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/website-staging-acceptance/
          if-no-files-found: warn
          retention-days: 14
