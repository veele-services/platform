name: Environment Isolation Preflight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type compare-staging-production-databases
        required: true
        type: string

permissions:
  contents: read

jobs:
  staging:
    name: Fingerprint staging database
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'compare-staging-production-databases'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      project_fingerprint: ${{ steps.identity.outputs.project_fingerprint }}
    env:
      APP_ENV: staging
      TARGET_ENVIRONMENT: staging
      APP_URL: ${{ vars.APP_URL }}
      EXPECTED_SUPABASE_PROJECT_REF: olyfmekyqozxrbrwwszu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Supabase database root certificate
        env:
          FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64: ${{ secrets.FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64 }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/fieldgrid-supabase-root-${GITHUB_RUN_ID}-${GITHUB_JOB}.crt"
          node scripts/fieldgrid-database-root-cert.mjs \
            --install-from-env FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64 \
            --out "$certificate_path"
          printf 'FIELDGRID_DATABASE_SSL_ROOT_CERT=%s\n' "$certificate_path" >> "$GITHUB_ENV"
      - id: identity
        name: Validate staging identity without logging it
        env:
          DATABASE_URL: ${{ secrets.FIELDGRID_RUNTIME_DATABASE_URL }}
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: >-
          node scripts/fieldgrid-environment-isolation-preflight.mjs
          --validate
          --require-migration-database
          --emit-github-output

  production:
    name: Fingerprint production database
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'compare-staging-production-databases'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      project_fingerprint: ${{ steps.identity.outputs.project_fingerprint }}
    env:
      APP_ENV: production
      TARGET_ENVIRONMENT: production
      APP_URL: ${{ vars.APP_URL }}
      EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      FORBIDDEN_SUPABASE_PROJECT_REF: olyfmekyqozxrbrwwszu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Supabase database root certificate
        env:
          FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64: ${{ secrets.FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64 }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/fieldgrid-supabase-root-${GITHUB_RUN_ID}-${GITHUB_JOB}.crt"
          node scripts/fieldgrid-database-root-cert.mjs \
            --install-from-env FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64 \
            --out "$certificate_path"
          printf 'FIELDGRID_DATABASE_SSL_ROOT_CERT=%s\n' "$certificate_path" >> "$GITHUB_ENV"
      - id: identity
        name: Validate production identity without logging it
        env:
          DATABASE_URL: ${{ secrets.FIELDGRID_RUNTIME_DATABASE_URL }}
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: >-
          node scripts/fieldgrid-environment-isolation-preflight.mjs
          --validate
          --require-migration-database
          --emit-github-output

  compare:
    name: Prove databases are distinct
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'compare-staging-production-databases'
    needs: [staging, production]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Compare secret-free fingerprints
        run: >-
          node scripts/fieldgrid-environment-isolation-preflight.mjs
          --compare
          '${{ needs.staging.outputs.project_fingerprint }}'
          '${{ needs.production.outputs.project_fingerprint }}'
