name: Database Baseline

on:
  workflow_dispatch:
    inputs:
      target:
        description: GitHub environment to baseline
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      confirm:
        description: Type "baseline" to mark existing schema migrations as applied
        required: true
        type: string

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline ${{ inputs.target }} database
    if: >-
      (inputs.target == 'staging' && github.ref == 'refs/heads/staging') ||
      (inputs.target == 'production' && github.ref == 'refs/heads/production')
    runs-on: [self-hosted, linux, x64, veele]
    environment:
      name: ${{ inputs.target }}
    env:
      APP_ENV: ${{ inputs.target }}
      TARGET_ENVIRONMENT: ${{ inputs.target }}
      APP_URL: ${{ vars.APP_URL }}
      EXPECTED_SUPABASE_PROJECT_REF: ${{ inputs.target == 'staging' && 'olyfmekyqozxrbrwwszu' || vars.SUPABASE_PROJECT_REF }}
      FORBIDDEN_SUPABASE_PROJECT_REF: ${{ inputs.target == 'production' && 'olyfmekyqozxrbrwwszu' || '' }}
      DATABASE_URL: ${{ secrets.FIELDGRID_RUNTIME_DATABASE_URL }}
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "true"
      PGSSLMODE: verify-full
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      EXPECTED_SOURCE_BRANCH: ${{ inputs.target }}
      EXPECTED_SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Confirm baseline
        if: ${{ inputs.confirm != 'baseline' }}
        run: |
          echo 'Type "baseline" in the confirm input to run this workflow.'
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable protected source before repository code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SOURCE_BRANCH" = "${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          node --input-type=module -e '
            const branch = process.env.EXPECTED_SOURCE_BRANCH;
            const expected = process.env.EXPECTED_SOURCE_SHA;
            if (!new Set(["staging", "production"]).has(branch)) {
              throw new Error("Database baseline source branch is invalid");
            }
            if (!/^[a-f0-9]{40}$/u.test(expected ?? "")) {
              throw new Error("Database baseline source SHA is invalid");
            }
            const response = await fetch(
              `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/${branch}`,
              {
                headers: {
                  Accept: "application/vnd.github+json",
                  Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  "X-GitHub-Api-Version": "2022-11-28",
                },
              },
            );
            if (!response.ok) {
              throw new Error(`Protected ref lookup failed with HTTP ${response.status}`);
            }
            if ((await response.json()).object?.sha !== expected) {
              throw new Error("Database baseline source is not the exact protected head");
            }
          '

      - name: Install pinned Supabase database root certificate
        env:
          FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64: ${{ secrets.FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64 }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/fieldgrid-supabase-root-${GITHUB_RUN_ID}-${GITHUB_JOB}.crt"
          node scripts/fieldgrid-database-root-cert.mjs \
            --install-from-env FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64 \
            --out "$certificate_path"
          printf 'FIELDGRID_DATABASE_SSL_ROOT_CERT=%s\n' "$certificate_path" >> "$GITHUB_ENV"

      - name: Check runtime
        env:
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          node -v
          pnpm -v
          node scripts/fieldgrid-environment-isolation-preflight.mjs \
            --validate \
            --require-migration-database

      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prod=false

      - name: Baseline migration history
        env:
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          pnpm run db:baseline
