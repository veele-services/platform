name: Reusable Fieldgrid verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APP_ENV: development
      DEPLOY_TARGET: local
      APP_URL: http://127.0.0.1:3000
      HOSTNAME: 127.0.0.1
      PORT: 3000
      SUPABASE_URL: http://127.0.0.1:59321
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:59321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-key-with-at-least-twenty-characters
      SUPABASE_SERVICE_ROLE_KEY: local-ci-service-role-key-with-at-least-twenty-characters
      GOOGLE_ROUTES_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify staging root/runner contracts with real Linux permissions
        run: bash scripts/test-staging-contract-linux.sh
      - name: Verify production and staging Unix account isolation in a disposable container
        run: bash scripts/test-production-contract-linux.sh
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject recognized credential formats in release sources
        run: node scripts/check-source-secrets.mjs
      - name: Check dependencies for high or critical advisories
        run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Start real isolated ticket antivirus and verify current definitions
        run: bash scripts/start-ticket-test-scanner.sh
      - name: Start clean local Supabase
        run: pnpm supabase start
      - name: Verify a forward work-order upgrade preserves historical evidence
        run: |
          pnpm supabase db reset --local --version 20260930142326 --yes
          node scripts/test-work-orders-upgrade.mjs seed
          pnpm supabase migration up --local
          node scripts/test-work-orders-upgrade.mjs verify
      - name: Verify notification upgrade preserves history and tenant overrides
        run: |
          pnpm supabase db reset --local --version 20260930192516 --yes
          node scripts/test-notifications-upgrade.mjs seed
          pnpm supabase migration up --local
          node scripts/test-notifications-upgrade.mjs verify
          pnpm supabase db reset --local --yes
      - name: Verify platform upgrade preserves invitation history and revoked authority
        run: |
          pnpm supabase db reset --local --version 20261001042234 --yes
          node scripts/test-platform-upgrade.mjs seed
          pnpm supabase migration up --local
          node scripts/test-platform-upgrade.mjs verify
          pnpm supabase db reset --local --yes
      - run: pnpm test:db
      - name: Verify immutable migration statement manifest against the clean replay
        run: pnpm db:verify-manifest
      - name: Check authorization entrypoints, resources and grant classifications
        run: node scripts/check-security-surface.mjs
      - name: Require an explicit completed review status for every authorization surface
        run: pnpm security:review
      - name: Verify real Auth, Data API, Storage and Realtime privacy boundaries
        run: pnpm test:security:http
      - run: pnpm supabase db lint --local --level warning --fail-on error
      - name: Fail on database security-advisor warnings or errors
        run: pnpm supabase db advisors --local --type security --level warn --fail-on warn
      - run: pnpm build
      - name: Package and launch the standalone release
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ARTIFACT_PATH: ${{ runner.temp }}/fieldgrid-release-smoke.tar.gz
        run: |
          scripts/package-release.sh
          node scripts/test-release-artifact.mjs
      - name: Reject recognized privileged credentials in public browser artifacts
        run: node scripts/check-release-secrets.mjs --browser
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run required browser flows
        run: pnpm test:e2e
      - name: Stop this job's isolated scanner
        if: always()
        run: |
          if docker container inspect fieldgrid-ticket-ci-scanner >/dev/null 2>&1; then
            docker stop fieldgrid-ticket-ci-scanner
            docker rm fieldgrid-ticket-ci-scanner
          fi
      - name: Ensure product branding and providers remain Fieldgrid and SendGrid
        # Match names, not fragments of DOM API identifiers such as activeElement.
        # Operator evidence may name an existing VPS/runner/repository. Those
        # infrastructure identities are not product branding or provider code.
        # Git is already required by checkout; do not silently skip a missing rg.
        run: |
          if git grep -n -i -E '\br[e]send\b' -- app components lib public scripts; then
            exit 1
          else
            result=$?
            test "$result" -eq 1
          fi
          # The explicitly requested public Veele website is tenant content.
          # Its scoped routes/assets/adapter are not global product branding.
          if git grep -n -i -E '\bv[e]ele\b' -- app components lib public scripts ':!app/api/veele-website/**' ':!lib/marketing/veele/**' ':!public/veele-services/**' ':!scripts/build-veele-marketing.mjs' ':!scripts/check-security-surface.mjs' ':!lib/operations/staging-smoke.test.ts' ':!scripts/verify-veele-website.mjs' ':!scripts/verify-production-website.mjs' ':!scripts/verify-production-promotion.mjs' ':!scripts/test-veele-marketing.mjs' ':!scripts/sql/veele-marketing-acceptance.sql'; then
            exit 1
          else
            result=$?
            test "$result" -eq 1
          fi
