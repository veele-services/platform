name: Reusable Fieldgrid verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APP_ENV: development
      DEPLOY_TARGET: local
      APP_URL: http://127.0.0.1:3000
      HOSTNAME: 127.0.0.1
      PORT: 3000
      SUPABASE_URL: http://127.0.0.1:59321
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:59321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-key-with-at-least-twenty-characters
      SUPABASE_SERVICE_ROLE_KEY: local-ci-service-role-key-with-at-least-twenty-characters
      GOOGLE_ROUTES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Start clean local Supabase
        run: pnpm supabase start
      - name: Verify a forward work-order upgrade preserves historical evidence
        run: |
          pnpm supabase db reset --local --version 20260930142326 --yes
          node scripts/test-work-orders-upgrade.mjs seed
          pnpm supabase migration up --local
          node scripts/test-work-orders-upgrade.mjs verify
      - run: pnpm db:reset
      - run: pnpm test:db
      - run: pnpm supabase db lint --local --level warning
      - run: pnpm supabase db advisors --local --level warn
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run required browser flows
        run: pnpm test:e2e
      - name: Ensure no retired tenant or mail-provider naming
        # Match names, not fragments of DOM API identifiers such as activeElement.
        # Git is already required by checkout; do not silently skip a missing rg.
        run: |
          if git grep -n -i -E '\bv[e]ele\b|\br[e]send\b' -- . ':!pnpm-lock.yaml'; then
            exit 1
          else
            result=$?
            test "$result" -eq 1
          fi
