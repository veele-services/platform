name: Deploy VEELE

on:
  workflow_dispatch:
    inputs:
      expected_staging_sha:
        description: "Exact promoted staging SHA"
        required: true
        type: string
      confirmation:
        description: "Type fieldgrid-staging-deploy-exact-sha"
        required: true
        type: string
      deployment_mode:
        description: "normal or staging-recovery"
        required: false
        default: normal
        type: string
      expected_active_staging_release_sha:
        description: "Exact active rollback release SHA for staging recovery"
        required: false
        default: ""
        type: string
      rollback_deploy_run_id:
        description: "Failed staging deploy run proving the rollback"
        required: false
        default: ""
        type: string
      recovery_preflight_run_id:
        description: "Successful Phase 2E preflight run proving recovery inputs"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: veele-staging
  cancel-in-progress: false

jobs:
  deploy:
    # W00 is deliberately a staging-only partial rollout. Production remains
    # frozen until a separate production principal, TLS and rollback package is
    # reviewed and provisioned; do not run this candidate on the production ref.
    runs-on: [self-hosted, linux, x64, veele]

    environment: staging

    env:
      TARGET: staging
      TARGET_ENVIRONMENT: staging
      EXPECTED_STAGING_SHA: ${{ inputs.expected_staging_sha }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
      DEPLOYMENT_MODE: ${{ inputs.deployment_mode || 'normal' }}
      EXPECTED_ACTIVE_STAGING_RELEASE_SHA: ${{ inputs.expected_active_staging_release_sha }}
      ROLLBACK_DEPLOY_RUN_ID: ${{ inputs.rollback_deploy_run_id }}
      RECOVERY_PREFLIGHT_RUN_ID: ${{ inputs.recovery_preflight_run_id }}
      SERVICE_NAME: veele-staging
      BASE_DIR: /var/www/veele/staging

      APP_ENV: ${{ vars.APP_ENV }}
      NODE_ENV: ${{ vars.NODE_ENV }}
      PORT: ${{ vars.PORT }}
      APP_URL: ${{ vars.APP_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      BASE_PATH: ${{ vars.BASE_PATH }}
      SITE_URL: ${{ vars.SITE_URL || vars.APP_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_APP_URL || vars.APP_URL }}
      NEXT_PUBLIC_MARKETING_SITE_URL: ${{ vars.NEXT_PUBLIC_MARKETING_SITE_URL }}
      FIELDGRID_WEBSITE_FORM_ID: ${{ vars.FIELDGRID_WEBSITE_FORM_ID }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}

      BACKOFFICE_SERVICE_NAME: ${{ vars.BACKOFFICE_SERVICE_NAME }}
      PERSONEEL_SERVICE_NAME: ${{ vars.PERSONEEL_SERVICE_NAME }}
      KLANT_SERVICE_NAME: ${{ vars.KLANT_SERVICE_NAME }}
      API_SERVICE_NAME: ${{ vars.API_SERVICE_NAME }}
      WEBSITE_SERVICE_NAME: ${{ vars.WEBSITE_SERVICE_NAME }}
      MARKETING_SERVICE_NAME: ${{ vars.MARKETING_SERVICE_NAME }}

      BACKOFFICE_PORT: ${{ vars.BACKOFFICE_PORT || vars.PORT }}
      PERSONEEL_PORT: ${{ vars.PERSONEEL_PORT }}
      KLANT_PORT: ${{ vars.KLANT_PORT }}
      API_PORT: ${{ vars.API_PORT }}
      WEBSITE_PORT: ${{ vars.WEBSITE_PORT }}
      MARKETING_PORT: ${{ vars.MARKETING_PORT }}
      FIELDGRID_CUSTOM_WEBSITE_ROUTES_JSON: ${{ vars.FIELDGRID_CUSTOM_WEBSITE_ROUTES_JSON }}
      FIELDGRID_CUSTOM_ROUTE_KEY: ${{ vars.FIELDGRID_CUSTOM_ROUTE_KEY }}
      FIELDGRID_CUSTOM_RELEASE_ID: ${{ format('git-commit:{0}', github.sha) }}
      FIELDGRID_CUSTOM_EXPECTED_HOST: ${{ vars.FIELDGRID_CUSTOM_EXPECTED_HOST }}
      FIELDGRID_CUSTOM_WEBSITE_HEALTH_REFRESH_ENABLED: ${{ vars.FIELDGRID_CUSTOM_WEBSITE_HEALTH_REFRESH_ENABLED || 'false' }}
      FIELDGRID_WEBSITE_AUTOMATION_ACTOR_USER_ID: ${{ secrets.FIELDGRID_WEBSITE_AUTOMATION_ACTOR_USER_ID }}
      FIELDGRID_STAGING_DATABASE_POOLER_HOST: ${{ vars.FIELDGRID_STAGING_DATABASE_POOLER_HOST }}
      FIELDGRID_RECOVERY_ALLOWED_ORIGINS: ${{ vars.FIELDGRID_RECOVERY_ALLOWED_ORIGINS }}
      EXPECTED_SUPABASE_PROJECT_REF: olyfmekyqozxrbrwwszu
      FORBIDDEN_SUPABASE_PROJECT_REF: ""

      DATABASE_URL: ${{ secrets.FIELDGRID_RUNTIME_DATABASE_URL }}
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "true"
      PGSSLMODE: verify-full
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
      MOLLIE_WEBHOOK_SECRET: ${{ secrets.MOLLIE_WEBHOOK_SECRET }}
      MOLLIE_WEBHOOK_URL: ${{ vars.MOLLIE_WEBHOOK_URL }}
      ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      FIELDGRID_EMAIL_CONFIG_ENCRYPTION_KEY: ${{ secrets.FIELDGRID_EMAIL_CONFIG_ENCRYPTION_KEY }}
      FIELDGRID_CREDENTIAL_RECOVERY_SECRET: ${{ secrets.FIELDGRID_CREDENTIAL_RECOVERY_SECRET }}
      FIELDGRID_OBJECT_SECURITY_MANAGEMENT_ACCESS_ENABLED: ${{ vars.FIELDGRID_OBJECT_SECURITY_MANAGEMENT_ACCESS_ENABLED || 'false' }}
      FIELDGRID_OBJECT_SECURITY_LEGACY_BACKFILL_ENABLED: ${{ vars.FIELDGRID_OBJECT_SECURITY_LEGACY_BACKFILL_ENABLED || 'false' }}
      FIELDGRID_OBJECT_SECURITY_ENCRYPTION_KEYS: ${{ secrets.FIELDGRID_OBJECT_SECURITY_ENCRYPTION_KEYS }}
      FIELDGRID_OBJECT_SECURITY_ACTIVE_KEY_VERSION: ${{ secrets.FIELDGRID_OBJECT_SECURITY_ACTIVE_KEY_VERSION }}
      FIELDGRID_OBJECT_SECURITY_OTP_PEPPER: ${{ secrets.FIELDGRID_OBJECT_SECURITY_OTP_PEPPER }}
      WEBSITE_FORM_HASH_SECRET: ${{ secrets.WEBSITE_FORM_HASH_SECRET }}
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
      # GitHub stores the browser key as a secret; Next receives it under the
      # canonical NEXT_PUBLIC name during the build so Maps JS can load it.
      NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_API_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_API_KEY || secrets.NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_API_KEY }}
      GOOGLE_MAPS_SERVER_API_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY }}
      GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
      GOOGLE_MAPS_ENABLED: ${{ vars.GOOGLE_MAPS_ENABLED || 'true' }}
      GOOGLE_MAPS_DEFAULT_COUNTRY: ${{ vars.GOOGLE_MAPS_DEFAULT_COUNTRY || 'NL' }}
      GOOGLE_MAPS_DEFAULT_LANGUAGE: ${{ vars.GOOGLE_MAPS_DEFAULT_LANGUAGE || 'nl' }}
      GOOGLE_MAPS_DEFAULT_REGION: ${{ vars.GOOGLE_MAPS_DEFAULT_REGION || 'NL' }}
      GOOGLE_PLACES_AUTOCOMPLETE_ENABLED: ${{ vars.GOOGLE_PLACES_AUTOCOMPLETE_ENABLED || 'true' }}
      GOOGLE_ROUTES_ENABLED: ${{ vars.GOOGLE_ROUTES_ENABLED || 'true' }}
      GOOGLE_ROUTES_TRAFFIC_ENABLED: ${{ vars.GOOGLE_ROUTES_TRAFFIC_ENABLED || 'true' }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      NOTIFICATION_WORKER_LIMIT: ${{ vars.NOTIFICATION_WORKER_LIMIT || '100' }}
      NOTIFICATION_WORKER_EMAIL_RATE_PER_RUN: ${{ vars.NOTIFICATION_WORKER_EMAIL_RATE_PER_RUN || '50' }}
      NOTIFICATION_WORKER_PUSH_RATE_PER_RUN: ${{ vars.NOTIFICATION_WORKER_PUSH_RATE_PER_RUN || '100' }}
      NOTIFICATION_WORKER_MAX_ATTEMPTS: ${{ vars.NOTIFICATION_WORKER_MAX_ATTEMPTS || '5' }}
      NOTIFICATION_WORKER_LOCK_SECONDS: ${{ vars.NOTIFICATION_WORKER_LOCK_SECONDS || '300' }}
      NOTIFICATION_WORKER_BASE_RETRY_SECONDS: ${{ vars.NOTIFICATION_WORKER_BASE_RETRY_SECONDS || '60' }}
      NOTIFICATION_WORKER_MAX_RETRY_SECONDS: ${{ vars.NOTIFICATION_WORKER_MAX_RETRY_SECONDS || '3600' }}
      NOTIFICATION_WORKER_SEND_DELAY_MS: ${{ vars.NOTIFICATION_WORKER_SEND_DELAY_MS || '0' }}
      FCM_ENABLED: ${{ vars.FCM_ENABLED || secrets.FCM_ENABLED || 'false' }}
      FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
      FCM_CLIENT_EMAIL: ${{ secrets.FCM_CLIENT_EMAIL }}
      FCM_PRIVATE_KEY: ${{ secrets.FCM_PRIVATE_KEY }}
      FCM_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON_BASE64 }}
      FCM_ANDROID_CHANNEL_ID: ${{ vars.FCM_ANDROID_CHANNEL_ID || secrets.FCM_ANDROID_CHANNEL_ID || 'veele_operations' }}

    steps:
      - name: Verify exact staging dispatch before repository code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "veele-services/platform"
          [[ "$EXPECTED_STAGING_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$DEPLOYMENT_MODE" = "normal" ]; then
            test "$GITHUB_REF" = "refs/heads/staging"
            test "$DEPLOY_CONFIRMATION" = "fieldgrid-staging-deploy-exact-sha"
            test "$GITHUB_SHA" = "$EXPECTED_STAGING_SHA"
          elif [ "$DEPLOYMENT_MODE" = "staging-recovery" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            test "$DEPLOY_CONFIRMATION" = "staging-recovery-only"
            [[ "$EXPECTED_ACTIVE_STAGING_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$ROLLBACK_DEPLOY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
            [[ "$RECOVERY_PREFLIGHT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
            test "$GITHUB_SHA" != "$EXPECTED_STAGING_SHA"
            test "$EXPECTED_ACTIVE_STAGING_RELEASE_SHA" != "$EXPECTED_STAGING_SHA"
          else
            echo "Unknown deployment mode: $DEPLOYMENT_MODE" >&2
            exit 1
          fi
          read -r live_main live_staging < <(
            node --input-type=module -e '
              const expected = process.env.EXPECTED_STAGING_SHA ?? "";
              if (!/^[0-9a-f]{40}$/u.test(expected)) {
                throw new Error("Expected staging SHA is invalid");
              }
              const refs = await Promise.all(
                ["main", "staging"].map(async (branch) => {
                  const response = await fetch(
                    `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/${branch}`,
                    {
                      headers: {
                        Accept: "application/vnd.github+json",
                        Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                        "X-GitHub-Api-Version": "2022-11-28",
                      },
                    },
                  );
                  if (!response.ok) {
                    throw new Error(`${branch} ref lookup failed with HTTP ${response.status}`);
                  }
                  const sha = (await response.json()).object?.sha ?? "";
                  if (!/^[0-9a-f]{40}$/u.test(sha)) {
                    throw new Error(`${branch} ref lookup returned an invalid SHA`);
                  }
                  return sha;
                }),
              );
              process.stdout.write(`${refs[0]} ${refs[1]}`);
            '
          )
          if [ "$DEPLOYMENT_MODE" = "normal" ]; then
            test "$live_main" = "$EXPECTED_STAGING_SHA"
          else
            test "$live_main" = "$GITHUB_SHA"
          fi
          test "$live_staging" = "$EXPECTED_STAGING_SHA"

      - name: Checkout exact staging candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable staging ref before repository code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout="$(git rev-parse HEAD)"
          test "$checkout" = "$GITHUB_SHA"
          if [ "$DEPLOYMENT_MODE" = "normal" ]; then
            test "$checkout" = "$EXPECTED_STAGING_SHA"
          else
            test "$GITHUB_REF" = "refs/heads/main"
          fi
          read -r live_main live_staging < <(
            node --input-type=module -e '
              const refs = await Promise.all(
                ["main", "staging"].map(async (branch) => {
                  const response = await fetch(
                    `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/${branch}`,
                    {
                      headers: {
                        Accept: "application/vnd.github+json",
                        Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                        "X-GitHub-Api-Version": "2022-11-28",
                      },
                    },
                  );
                  if (!response.ok) {
                    throw new Error(`${branch} ref lookup failed with HTTP ${response.status}`);
                  }
                  const sha = (await response.json()).object?.sha ?? "";
                  if (!/^[0-9a-f]{40}$/u.test(sha)) {
                    throw new Error(`${branch} ref lookup returned an invalid SHA`);
                  }
                  return sha;
                }),
              );
              process.stdout.write(`${refs[0]} ${refs[1]}`);
            '
          )
          if [ "$DEPLOYMENT_MODE" = "normal" ]; then
            test "$live_main" = "$EXPECTED_STAGING_SHA"
          else
            test "$live_main" = "$GITHUB_SHA"
          fi
          test "$live_staging" = "$EXPECTED_STAGING_SHA"

      - name: Verify reviewed recovery preflight before activation
        if: env.DEPLOYMENT_MODE == 'staging-recovery'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json="$(gh run view "$RECOVERY_PREFLIGHT_RUN_ID" --json conclusion,event,headSha,workflowName)"
          RUN_JSON="$run_json" EXPECTED_MAIN_SHA="$GITHUB_SHA" node --input-type=module - <<'NODE'
          const run = JSON.parse(process.env.RUN_JSON ?? "{}");
          if (
            run.conclusion !== "success" ||
            run.event !== "workflow_dispatch" ||
            run.headSha !== process.env.EXPECTED_MAIN_SHA ||
            run.workflowName !== "Phase 2E Staging Promotion Preflight"
          ) {
            throw new Error("Recovery preflight run is not an exact successful main run.");
          }
          NODE
          evidence_root="$RUNNER_TEMP/fieldgrid-recovery-preflight-$RECOVERY_PREFLIGHT_RUN_ID"
          rm -rf "$evidence_root"
          gh run download "$RECOVERY_PREFLIGHT_RUN_ID" --name "phase2e-staging-preflight-${RECOVERY_PREFLIGHT_RUN_ID}-${GITHUB_SHA}" --dir "$evidence_root"
          report_path="$(find "$evidence_root" -type f -path '*/artifacts/phase2e-staging-preflight/phase2e-staging-preflight.json' -print -quit)"
          test -n "$report_path"
          REPORT_PATH="$report_path" EXPECTED_MAIN_SHA="$GITHUB_SHA" EXPECTED_STAGING_SHA="$EXPECTED_STAGING_SHA" EXPECTED_ACTIVE_SHA="$EXPECTED_ACTIVE_STAGING_RELEASE_SHA" EXPECTED_ROLLBACK_RUN="$ROLLBACK_DEPLOY_RUN_ID" node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
          const rollback = report.rollback ?? {};
          const proof = rollback.recoveryProof ?? {};
          const deployRun = proof.deployRun ?? {};
          if (
            report.version !== "phase2e-staging-preflight-v2" ||
            rollback.expectedGitStagingSha !== process.env.EXPECTED_STAGING_SHA ||
            rollback.expectedActiveStagingReleaseSha !== process.env.EXPECTED_ACTIVE_SHA ||
            rollback.gitAndActiveAligned !== false ||
            rollback.recoveryMode !== "verified-deploy-rollback" ||
            proof.mode !== "verified-deploy-rollback" ||
            deployRun.id !== process.env.EXPECTED_ROLLBACK_RUN ||
            deployRun.headSha !== process.env.EXPECTED_STAGING_SHA ||
            deployRun.branch !== "staging" ||
            deployRun.conclusion !== "failure" ||
            deployRun.apiVerified !== true
          ) {
            throw new Error("Recovery preflight rollback proof does not match the requested deployment.");
          }
          NODE

      - name: Bind custom routes to recovery candidate in runner environment
        if: env.DEPLOYMENT_MODE == 'staging-recovery'
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const routes = JSON.parse(process.env.FIELDGRID_CUSTOM_WEBSITE_ROUTES_JSON ?? "[]");
            for (const route of routes) route.releaseId = `git-commit:${process.env.GITHUB_SHA}`;
            process.stdout.write(`FIELDGRID_CUSTOM_WEBSITE_ROUTES_JSON=${JSON.stringify(routes)}\n`);
          ' >> "$GITHUB_ENV"

      - name: Install pinned Supabase database root certificate
        env:
          FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64: ${{ secrets.FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64 }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/fieldgrid-supabase-root-${GITHUB_RUN_ID}-${GITHUB_JOB}.crt"
          node scripts/fieldgrid-database-root-cert.mjs \
            --install-from-env FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64 \
            --out "$certificate_path"
          printf 'FIELDGRID_DATABASE_SSL_ROOT_CERT=%s\n' "$certificate_path" >> "$GITHUB_ENV"

      - name: Check runtime
        run: |
          set -euo pipefail
          node -v
          pnpm -v
          echo "Deploy target: $TARGET"
          echo "App URL: $APP_URL"
          echo "Port: $PORT"
          echo "Base path: $BASE_PATH"
          echo "Backoffice service: ${BACKOFFICE_SERVICE_NAME:-$SERVICE_NAME}"
          echo "Personeel service: ${PERSONEEL_SERVICE_NAME:-<not configured>}"
          echo "Klant service: ${KLANT_SERVICE_NAME:-<not configured>}"
          echo "API service: ${API_SERVICE_NAME:-<not configured>}"
          echo "Website service: ${WEBSITE_SERVICE_NAME:-<not configured>}"
          echo "Marketing service: ${MARKETING_SERVICE_NAME:-<not configured>}"

      - name: Validate service configuration
        run: |
          set -euo pipefail

          require_pair() {
            local service_name="$1"
            local service_value="$2"
            local port_name="$3"
            local port_value="$4"

            if [ -n "$service_value" ] && [ -z "$port_value" ]; then
              echo "::error::${service_name} is configured, but ${port_name} is empty."
              exit 1
            fi

            if [ -z "$service_value" ] && [ -n "$port_value" ]; then
              echo "::error::${port_name} is configured, but ${service_name} is empty."
              exit 1
            fi
          }

          require_pair "PERSONEEL_SERVICE_NAME" "${PERSONEEL_SERVICE_NAME:-}" "PERSONEEL_PORT" "${PERSONEEL_PORT:-}"
          require_pair "KLANT_SERVICE_NAME" "${KLANT_SERVICE_NAME:-}" "KLANT_PORT" "${KLANT_PORT:-}"
          require_pair "API_SERVICE_NAME" "${API_SERVICE_NAME:-}" "API_PORT" "${API_PORT:-}"
          require_pair "WEBSITE_SERVICE_NAME" "${WEBSITE_SERVICE_NAME:-}" "WEBSITE_PORT" "${WEBSITE_PORT:-}"
          require_pair "MARKETING_SERVICE_NAME" "${MARKETING_SERVICE_NAME:-}" "MARKETING_PORT" "${MARKETING_PORT:-}"

          if [ -z "${BACKOFFICE_PORT:-}" ]; then
            echo "::error::PORT or BACKOFFICE_PORT must be configured for the backoffice service."
            exit 1
          fi

          if [ "$FIELDGRID_CUSTOM_WEBSITE_HEALTH_REFRESH_ENABLED" != "true" ] && [ "$FIELDGRID_CUSTOM_WEBSITE_HEALTH_REFRESH_ENABLED" != "false" ]; then
            echo "::error::FIELDGRID_CUSTOM_WEBSITE_HEALTH_REFRESH_ENABLED must be true or false."
            exit 1
          fi
          if [ "$FIELDGRID_CUSTOM_WEBSITE_HEALTH_REFRESH_ENABLED" = "true" ]; then
            if [ "$TARGET" != "staging" ]; then
              echo "::error::Custom website health refresh is staging-only."
              exit 1
            fi
            if ! [[ "$FIELDGRID_WEBSITE_AUTOMATION_ACTOR_USER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
              echo "::error::FIELDGRID_WEBSITE_AUTOMATION_ACTOR_USER_ID must be a UUID when custom website health refresh is enabled."
              exit 1
            fi
            if [ -z "$FIELDGRID_CUSTOM_WEBSITE_ROUTES_JSON" ]; then
              echo "::error::FIELDGRID_CUSTOM_WEBSITE_ROUTES_JSON is required when custom website health refresh is enabled."
              exit 1
            fi
          fi

          if [ "$FIELDGRID_OBJECT_SECURITY_MANAGEMENT_ACCESS_ENABLED" = "true" ] || [ "$FIELDGRID_OBJECT_SECURITY_LEGACY_BACKFILL_ENABLED" = "true" ]; then
            for required_secret in FIELDGRID_OBJECT_SECURITY_ENCRYPTION_KEYS FIELDGRID_OBJECT_SECURITY_ACTIVE_KEY_VERSION FIELDGRID_OBJECT_SECURITY_OTP_PEPPER; do
              if [ -z "${!required_secret:-}" ]; then
                echo "::error::${required_secret} is required when Object Security or its backfill is enabled."
                exit 1
              fi
            done
            if ! [[ "$FIELDGRID_OBJECT_SECURITY_ACTIVE_KEY_VERSION" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::FIELDGRID_OBJECT_SECURITY_ACTIVE_KEY_VERSION must be a positive integer."
              exit 1
            fi
            node -e 'const keys=JSON.parse(process.env.FIELDGRID_OBJECT_SECURITY_ENCRYPTION_KEYS); const active=process.env.FIELDGRID_OBJECT_SECURITY_ACTIVE_KEY_VERSION; if (!keys || typeof keys!=="object" || Array.isArray(keys) || typeof keys[active]!=="string") process.exit(1)' || {
              echo "::error::FIELDGRID_OBJECT_SECURITY_ENCRYPTION_KEYS must be JSON and contain the active key version."
              exit 1
            }
            if [ "${#FIELDGRID_OBJECT_SECURITY_OTP_PEPPER}" -lt 32 ]; then
              echo "::error::FIELDGRID_OBJECT_SECURITY_OTP_PEPPER must contain at least 32 bytes."
              exit 1
            fi
          fi

          configured_ports=()
          for value in "${BACKOFFICE_PORT:-}" "${PERSONEEL_PORT:-}" "${KLANT_PORT:-}" "${API_PORT:-}" "${WEBSITE_PORT:-}" "${MARKETING_PORT:-}"; do
            if [ -n "$value" ] && ! [[ "$value" =~ ^[0-9]+$ ]]; then
              echo "::error::Configured ports must be numeric. Invalid value: $value"
              exit 1
            fi
            if [ -n "$value" ]; then
              for configured_port in "${configured_ports[@]}"; do
                if [ "$configured_port" = "$value" ]; then
                  echo "::error::Configured ports must be unique. Duplicate value: $value"
                  exit 1
                fi
              done
              configured_ports+=("$value")
            fi
          done

      - name: Validate environment isolation
        env:
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          node scripts/fieldgrid-environment-isolation-preflight.mjs
          --validate
          --require-migration-database

      - name: Prepare release directory
        run: |
          set -euo pipefail

          RELEASE="$BASE_DIR/releases/$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"

          mkdir -p "$RELEASE"
          mkdir -p "$BASE_DIR/shared"

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='dist' \
            --exclude='.env' \
            ./ "$RELEASE/"

          if [ "$TARGET" = "staging" ]; then
            certificate_destination="$RELEASE/.fieldgrid/supabase-root-2021-ca.crt"
          else
            certificate_destination="$BASE_DIR/shared/supabase-root-2021-ca.crt"
          fi
          install -D -m 600 \
            "$FIELDGRID_DATABASE_SSL_ROOT_CERT" \
            "$certificate_destination"

          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "FIELDGRID_DATABASE_SSL_ROOT_CERT=$certificate_destination" >> "$GITHUB_ENV"

      - name: Write staging release SHA marker
        if: env.TARGET == 'staging'
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > "$RELEASE/.fieldgrid-release-sha"

      - name: Write environment file
        run: |
          set -euo pipefail

          ENV_FILE="$BASE_DIR/shared/.env"
          if [ "$TARGET" = "staging" ]; then
            # Keep the candidate isolated until migrations and W00 pass. The
            # activation helper publishes it together with the current symlink.
            ENV_FILE="$RELEASE/.env"
          fi

          {
            printf 'APP_ENV=%s\n' "$APP_ENV"
            printf 'TARGET_ENVIRONMENT=%s\n' "$TARGET"
            printf 'EXPECTED_SUPABASE_PROJECT_REF=%s\n' "$EXPECTED_SUPABASE_PROJECT_REF"
            printf 'FORBIDDEN_SUPABASE_PROJECT_REF=%s\n' "$FORBIDDEN_SUPABASE_PROJECT_REF"
            printf 'NODE_ENV=%s\n' "$NODE_ENV"
            printf 'PORT=%s\n' "$PORT"
            printf 'APP_URL=%s\n' "$APP_URL"
            printf 'NEXT_PUBLIC_APP_URL=%s\n' "$NEXT_PUBLIC_APP_URL"
            printf 'SITE_URL=%s\n' "$SITE_URL"
            printf 'NEXT_PUBLIC_SITE_URL=%s\n' "$NEXT_PUBLIC_SITE_URL"
            printf 'NEXT_PUBLIC_MARKETING_SITE_URL=%s\n' "$NEXT_PUBLIC_MARKETING_SITE_URL"
            printf 'FIELDGRID_WEBSITE_FORM_ID=%s\n' "$FIELDGRID_WEBSITE_FORM_ID"
            printf 'BASE_PATH=%s\n' "$BASE_PATH"
            printf 'LOG_LEVEL=%s\n' "$LOG_LEVEL"
            printf 'BACKOFFICE_PORT=%s\n' "$BACKOFFICE_PORT"
            printf 'PERSONEEL_PORT=%s\n' "$PERSONEEL_PORT"
            printf 'KLANT_PORT=%s\n' "$KLANT_PORT"
            printf 'API_PORT=%s\n' "$API_PORT"
            printf 'WEBSITE_PORT=%s\n' "$WEBSITE_PORT"
            printf 'MARKETING_PORT=%s\n' "$MARKETING_PORT"
            printf 'FIELDGRID_CUSTOM_WEBSITE_ROUTES_JSON=%s\n' "$FIELDGRID_CUSTOM_WEBSITE_ROUTES_JSON"
            printf 'FIELDGRID_CUSTOM_ROUTE_KEY=%s\n' "$FIELDGRID_CUSTOM_ROUTE_KEY"
            printf 'FIELDGRID_CUSTOM_RELEASE_ID=%s\n' "$FIELDGRID_CUSTOM_RELEASE_ID"
            printf 'FIELDGRID_CUSTOM_EXPECTED_HOST=%s\n' "$FIELDGRID_CUSTOM_EXPECTED_HOST"
            printf 'FIELDGRID_CUSTOM_WEBSITE_HEALTH_REFRESH_ENABLED=%s\n' "$FIELDGRID_CUSTOM_WEBSITE_HEALTH_REFRESH_ENABLED"
            printf 'FIELDGRID_WEBSITE_AUTOMATION_ACTOR_USER_ID=%s\n' "$FIELDGRID_WEBSITE_AUTOMATION_ACTOR_USER_ID"
            printf 'FIELDGRID_STAGING_DATABASE_POOLER_HOST=%s\n' "$FIELDGRID_STAGING_DATABASE_POOLER_HOST"
            printf 'FIELDGRID_RECOVERY_ALLOWED_ORIGINS=%s\n' "$FIELDGRID_RECOVERY_ALLOWED_ORIGINS"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'DB_SSL=%s\n' "$DB_SSL"
            printf 'DB_SSL_REJECT_UNAUTHORIZED=%s\n' "$DB_SSL_REJECT_UNAUTHORIZED"
            printf 'PGSSLMODE=%s\n' "$PGSSLMODE"
            printf 'FIELDGRID_DATABASE_SSL_ROOT_CERT=%s\n' "$FIELDGRID_DATABASE_SSL_ROOT_CERT"
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_JWT_SECRET=%s\n' "$SUPABASE_JWT_SECRET"
            printf 'MOLLIE_API_KEY=%s\n' "$MOLLIE_API_KEY"
            printf 'MOLLIE_WEBHOOK_SECRET=%s\n' "$MOLLIE_WEBHOOK_SECRET"
            printf 'MOLLIE_WEBHOOK_URL=%s\n' "$MOLLIE_WEBHOOK_URL"
            printf 'ADMIN_API_SECRET=%s\n' "$ADMIN_API_SECRET"
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            printf 'FIELDGRID_EMAIL_CONFIG_ENCRYPTION_KEY=%s\n' "$FIELDGRID_EMAIL_CONFIG_ENCRYPTION_KEY"
            printf 'FIELDGRID_CREDENTIAL_RECOVERY_SECRET=%s\n' "$FIELDGRID_CREDENTIAL_RECOVERY_SECRET"
            printf 'FIELDGRID_OBJECT_SECURITY_MANAGEMENT_ACCESS_ENABLED=%s\n' "$FIELDGRID_OBJECT_SECURITY_MANAGEMENT_ACCESS_ENABLED"
            printf 'FIELDGRID_OBJECT_SECURITY_LEGACY_BACKFILL_ENABLED=%s\n' "$FIELDGRID_OBJECT_SECURITY_LEGACY_BACKFILL_ENABLED"
            printf 'FIELDGRID_OBJECT_SECURITY_ENCRYPTION_KEYS=%s\n' "$FIELDGRID_OBJECT_SECURITY_ENCRYPTION_KEYS"
            printf 'FIELDGRID_OBJECT_SECURITY_ACTIVE_KEY_VERSION=%s\n' "$FIELDGRID_OBJECT_SECURITY_ACTIVE_KEY_VERSION"
            printf 'FIELDGRID_OBJECT_SECURITY_OTP_PEPPER=%s\n' "$FIELDGRID_OBJECT_SECURITY_OTP_PEPPER"
            printf 'WEBSITE_FORM_HASH_SECRET=%s\n' "$WEBSITE_FORM_HASH_SECRET"
            printf 'RESEND_FROM_EMAIL=%s\n' "$RESEND_FROM_EMAIL"
            printf 'NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_API_KEY=%s\n' "$NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_API_KEY"
            printf 'GOOGLE_MAPS_SERVER_API_KEY=%s\n' "$GOOGLE_MAPS_SERVER_API_KEY"
            printf 'GOOGLE_MAPS_MAP_ID=%s\n' "$GOOGLE_MAPS_MAP_ID"
            printf 'GOOGLE_MAPS_ENABLED=%s\n' "$GOOGLE_MAPS_ENABLED"
            printf 'GOOGLE_MAPS_DEFAULT_COUNTRY=%s\n' "$GOOGLE_MAPS_DEFAULT_COUNTRY"
            printf 'GOOGLE_MAPS_DEFAULT_LANGUAGE=%s\n' "$GOOGLE_MAPS_DEFAULT_LANGUAGE"
            printf 'GOOGLE_MAPS_DEFAULT_REGION=%s\n' "$GOOGLE_MAPS_DEFAULT_REGION"
            printf 'GOOGLE_PLACES_AUTOCOMPLETE_ENABLED=%s\n' "$GOOGLE_PLACES_AUTOCOMPLETE_ENABLED"
            printf 'GOOGLE_ROUTES_ENABLED=%s\n' "$GOOGLE_ROUTES_ENABLED"
            printf 'GOOGLE_ROUTES_TRAFFIC_ENABLED=%s\n' "$GOOGLE_ROUTES_TRAFFIC_ENABLED"
            printf 'NEXT_PUBLIC_VAPID_PUBLIC_KEY=%s\n' "$NEXT_PUBLIC_VAPID_PUBLIC_KEY"
            printf 'VAPID_PUBLIC_KEY=%s\n' "$VAPID_PUBLIC_KEY"
            printf 'VAPID_PRIVATE_KEY=%s\n' "$VAPID_PRIVATE_KEY"
            printf 'VAPID_SUBJECT=%s\n' "$VAPID_SUBJECT"
            printf 'NOTIFICATION_WORKER_LIMIT=%s\n' "$NOTIFICATION_WORKER_LIMIT"
            printf 'NOTIFICATION_WORKER_EMAIL_RATE_PER_RUN=%s\n' "$NOTIFICATION_WORKER_EMAIL_RATE_PER_RUN"
            printf 'NOTIFICATION_WORKER_PUSH_RATE_PER_RUN=%s\n' "$NOTIFICATION_WORKER_PUSH_RATE_PER_RUN"
            printf 'NOTIFICATION_WORKER_MAX_ATTEMPTS=%s\n' "$NOTIFICATION_WORKER_MAX_ATTEMPTS"
            printf 'NOTIFICATION_WORKER_LOCK_SECONDS=%s\n' "$NOTIFICATION_WORKER_LOCK_SECONDS"
            printf 'NOTIFICATION_WORKER_BASE_RETRY_SECONDS=%s\n' "$NOTIFICATION_WORKER_BASE_RETRY_SECONDS"
            printf 'NOTIFICATION_WORKER_MAX_RETRY_SECONDS=%s\n' "$NOTIFICATION_WORKER_MAX_RETRY_SECONDS"
            printf 'NOTIFICATION_WORKER_SEND_DELAY_MS=%s\n' "$NOTIFICATION_WORKER_SEND_DELAY_MS"
            printf 'FCM_ENABLED=%s\n' "$FCM_ENABLED"
            printf 'FCM_PROJECT_ID=%s\n' "$FCM_PROJECT_ID"
            printf 'FCM_CLIENT_EMAIL=%s\n' "$FCM_CLIENT_EMAIL"
            printf 'FCM_PRIVATE_KEY=%s\n' "$FCM_PRIVATE_KEY"
            printf 'FCM_SERVICE_ACCOUNT_JSON_BASE64=%s\n' "$FCM_SERVICE_ACCOUNT_JSON_BASE64"
            printf 'FCM_ANDROID_CHANNEL_ID=%s\n' "$FCM_ANDROID_CHANNEL_ID"
          } > "$ENV_FILE"

          chmod 640 "$ENV_FILE"
          chgrp veele-deploy "$ENV_FILE"

          if [ "$TARGET" = "production" ]; then
            ln -sfn "$BASE_DIR/shared/.env" "$RELEASE/.env"
          fi
          ln -sfn "$RELEASE/.env" "$RELEASE/.env.production"

      - name: Install dependencies
        working-directory: ${{ env.RELEASE }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      # This is deliberately contract-only after checkout. Runtime evidence is
      # enforced by the controlled promotion and pre-activation paths.
      - name: Validate Fieldgrid release contracts (static)
        working-directory: ${{ env.RELEASE }}
        run: |
          set -euo pipefail
          pnpm fieldgrid:migration-order-check:check
          pnpm fieldgrid:test-layers:check
          pnpm fieldgrid:staging-promotion-gate:check

      - name: Build
        working-directory: ${{ env.RELEASE }}
        run: |
          set -euo pipefail
          pnpm build

      - name: Run database migrations
        working-directory: ${{ env.RELEASE }}
        env:
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          pnpm run db:migrate

      - name: Backfill staging SMTP credentials
        if: env.TARGET == 'staging'
        working-directory: ${{ env.RELEASE }}
        env:
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIELDGRID_SMTP_BACKFILL_CONFIRM: smtp-encrypted-at-rest-v1
        run: |
          set -euo pipefail
          pnpm fieldgrid:smtp-credential-backfill --apply

      - name: Encrypt and clear legacy object secrets
        if: env.TARGET == 'staging' && env.FIELDGRID_OBJECT_SECURITY_LEGACY_BACKFILL_ENABLED == 'true'
        working-directory: ${{ env.RELEASE }}
        env:
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIELDGRID_OBJECT_SECURITY_BACKFILL_CONFIRM: object-security-encrypted-v1
        run: |
          set -euo pipefail
          pnpm fieldgrid:object-security-legacy-backfill --apply

      - name: Verify no plaintext object secrets remain
        if: env.TARGET == 'staging' && env.FIELDGRID_OBJECT_SECURITY_LEGACY_BACKFILL_ENABLED == 'true'
        working-directory: ${{ env.RELEASE }}
        env:
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          pnpm fieldgrid:object-security-legacy-backfill
      - name: Verify no plaintext SMTP credentials remain
        working-directory: ${{ env.RELEASE }}
        env:
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          pnpm fieldgrid:smtp-credential-backfill

      - name: Verify staging e-mail provider readiness
        if: env.TARGET == 'staging'
        working-directory: ${{ env.RELEASE }}
        run: |
          set -euo pipefail
          pnpm fieldgrid:email-provider-readiness

      - name: Verify migration-admin ownership before runtime principal cutover
        if: env.TARGET == 'staging'
        working-directory: ${{ env.RELEASE }}
        env:
          # The existing W00 ownership proof describes the migration principal,
          # not the zero-ownership application runtime principal. Keep this
          # credential step-scoped and run any runtime-role provisioning/proof
          # after this preflight. Never fall back to the admin URL at runtime.
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIELDGRID_W00_STAGING_PRINCIPAL_CONFIRM: fieldgrid-w00-staging-principal-read-only-v1
          FIELDGRID_W00_STAGING_TENANT_A_HOST: ${{ vars.FIELDGRID_W00_STAGING_TENANT_A_HOST }}
          FIELDGRID_W00_STAGING_TENANT_A_ID: ${{ secrets.FIELDGRID_W00_STAGING_TENANT_A_ID }}
          FIELDGRID_W00_STAGING_TENANT_B_HOST: ${{ vars.FIELDGRID_W00_STAGING_TENANT_B_HOST }}
          FIELDGRID_W00_STAGING_TENANT_B_ID: ${{ secrets.FIELDGRID_W00_STAGING_TENANT_B_ID }}
        run: |
          set -euo pipefail
          for required_name in \
            FIELDGRID_MIGRATION_DATABASE_URL \
            FIELDGRID_W00_STAGING_TENANT_A_HOST \
            FIELDGRID_W00_STAGING_TENANT_A_ID \
            FIELDGRID_W00_STAGING_TENANT_B_HOST \
            FIELDGRID_W00_STAGING_TENANT_B_ID; do
            test -n "${!required_name}"
          done

          FIELDGRID_W00_STAGING_DATABASE_URL="$FIELDGRID_MIGRATION_DATABASE_URL" \
            pnpm --filter @workspace/db exec tsx \
              ../../scripts/fieldgrid-w00-staging-principal-gate.mts --strict
          node scripts/fieldgrid-staging-promotion-gate.mjs \
            --strict-w00-principal \
            --expected-deployed-sha "$GITHUB_SHA"

      - name: Provision staging runtime database principal
        if: env.TARGET == 'staging'
        working-directory: ${{ env.RELEASE }}
        env:
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIELDGRID_RUNTIME_DATABASE_PASSWORD: ${{ secrets.FIELDGRID_RUNTIME_DATABASE_PASSWORD }}
          FIELDGRID_RUNTIME_DATABASE_URL: ${{ secrets.FIELDGRID_RUNTIME_DATABASE_URL }}
          FIELDGRID_RUNTIME_EXPECTED_SHA: ${{ github.sha }}
          FIELDGRID_RUNTIME_PRINCIPAL_CONFIRM: fieldgrid-w00-runtime-principal-staging-v1
          NEXT_PUBLIC_SUPABASE_URL: https://olyfmekyqozxrbrwwszu.supabase.co
        run: |
          set -euo pipefail
          for required_name in \
            FIELDGRID_MIGRATION_DATABASE_URL \
            FIELDGRID_RUNTIME_DATABASE_PASSWORD \
            FIELDGRID_RUNTIME_DATABASE_URL \
            FIELDGRID_RUNTIME_EXPECTED_SHA \
            FIELDGRID_RUNTIME_PRINCIPAL_CONFIRM \
            FIELDGRID_STAGING_DATABASE_POOLER_HOST; do
            test -n "${!required_name}"
          done
          test "$FIELDGRID_RUNTIME_EXPECTED_SHA" = "$GITHUB_SHA"
          node scripts/fieldgrid-w00-runtime-principal.mjs --apply

      - name: Verify least-privileged staging runtime principal
        if: env.TARGET == 'staging'
        working-directory: ${{ env.RELEASE }}
        env:
          FIELDGRID_RUNTIME_DATABASE_URL: ${{ secrets.FIELDGRID_RUNTIME_DATABASE_URL }}
          FIELDGRID_RUNTIME_EXPECTED_SHA: ${{ github.sha }}
          FIELDGRID_RUNTIME_PRINCIPAL_CONFIRM: fieldgrid-w00-runtime-principal-staging-v1
          NEXT_PUBLIC_SUPABASE_URL: https://olyfmekyqozxrbrwwszu.supabase.co
        run: |
          set -euo pipefail
          for required_name in \
            FIELDGRID_RUNTIME_DATABASE_URL \
            FIELDGRID_RUNTIME_EXPECTED_SHA \
            FIELDGRID_RUNTIME_PRINCIPAL_CONFIRM \
            FIELDGRID_STAGING_DATABASE_POOLER_HOST; do
            test -n "${!required_name}"
          done
          test "$FIELDGRID_RUNTIME_EXPECTED_SHA" = "$GITHUB_SHA"
          node scripts/fieldgrid-w00-runtime-principal-gate.mjs --strict

      - name: Activate release
        if: env.TARGET == 'production'
        run: |
          set -euo pipefail

          chown -R github-runner:veele-deploy "$RELEASE"
          chmod -R u+rwX,g+rX,o-rwx "$RELEASE"

          ln -sfn "$RELEASE" "$BASE_DIR/current.new"
          mv -Tf "$BASE_DIR/current.new" "$BASE_DIR/current"

          services=("${BACKOFFICE_SERVICE_NAME:-$SERVICE_NAME}")

          if [ -n "${PERSONEEL_SERVICE_NAME:-}" ]; then
            services+=("$PERSONEEL_SERVICE_NAME")
          fi

          if [ -n "${KLANT_SERVICE_NAME:-}" ]; then
            services+=("$KLANT_SERVICE_NAME")
          fi

          if [ -n "${API_SERVICE_NAME:-}" ]; then
            services+=("$API_SERVICE_NAME")
          fi

          for service in "${services[@]}"; do
            sudo systemctl restart "$service"
          done

          sudo systemctl reload caddy

      - name: Activate staging release
        if: env.TARGET == 'staging'
        env:
          FIELDGRID_DEPLOY_EVIDENCE_GROUP: veele-deploy
        run: |
          set -euo pipefail

          PREVIOUS_CURRENT=""
          if [ -L "$BASE_DIR/current" ]; then
            PREVIOUS_CURRENT="$(readlink "$BASE_DIR/current")"
          fi
          echo "PREVIOUS_CURRENT=$PREVIOUS_CURRENT" >> "$GITHUB_ENV"

          chown -R github-runner:veele-deploy "$RELEASE"
          chmod -R u+rwX,g+rX,o-rwx "$RELEASE"
          chmod 600 "$RELEASE/.fieldgrid/supabase-root-2021-ca.crt"

          bash "$RELEASE/scripts/fieldgrid-atomic-release-activate.sh" \
            --environment "$TARGET" \
            --base-dir "$BASE_DIR" \
            --release-path "$RELEASE" \
            --expected-sha "$GITHUB_SHA" \
            --migration-status success \
            --prepared-env "$RELEASE/.env" \
            --shared-env "$BASE_DIR/shared/.env" \
            --rollback-env "$BASE_DIR/shared/.env.rollback-$GITHUB_SHA" \
            --evidence-file "$BASE_DIR/shared/atomic-activation-${GITHUB_RUN_ID:-manual}-${GITHUB_SHA::7}.json"

      - name: Run staging deploy health gate
        if: env.TARGET == 'staging'
        env:
          BACKOFFICE_PUBLIC_LOGIN_URL: ${{ vars.BACKOFFICE_PUBLIC_LOGIN_URL }}
          PERSONEEL_PUBLIC_HEALTH_URL: ${{ vars.PERSONEEL_PUBLIC_HEALTH_URL }}
          KLANT_PUBLIC_HEALTH_URL: ${{ vars.KLANT_PUBLIC_HEALTH_URL }}
          API_PUBLIC_HEALTH_URL: ${{ vars.API_PUBLIC_HEALTH_URL }}
          WEBSITE_PUBLIC_HEALTH_URL: ${{ vars.WEBSITE_PUBLIC_HEALTH_URL }}
          MARKETING_PUBLIC_HEALTH_URL: ${{ vars.MARKETING_PUBLIC_HEALTH_URL }}
          API_PUBLIC_ROOT_URL: ${{ vars.API_PUBLIC_ROOT_URL }}
          BACKOFFICE_PUBLIC_URL: ${{ vars.BACKOFFICE_PUBLIC_URL || vars.APP_URL }}
          PERSONEEL_PUBLIC_URL: ${{ vars.PERSONEEL_PUBLIC_URL }}
          KLANT_PUBLIC_URL: ${{ vars.KLANT_PUBLIC_URL }}
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
          WEBSITE_PUBLIC_URL: ${{ vars.WEBSITE_PUBLIC_URL }}
          MARKETING_PUBLIC_URL: ${{ vars.MARKETING_PUBLIC_URL }}
          FIELDGRID_DEPLOY_EVIDENCE_GROUP: veele-deploy
          FIELDGRID_DEPLOY_HEALTH_ATTEMPTS: ${{ vars.FIELDGRID_DEPLOY_HEALTH_ATTEMPTS || '12' }}
          FIELDGRID_DEPLOY_HEALTH_RETRY_SECONDS: ${{ vars.FIELDGRID_DEPLOY_HEALTH_RETRY_SECONDS || '5' }}
          FIELDGRID_DEPLOY_CURL_MAX_TIME_SECONDS: ${{ vars.FIELDGRID_DEPLOY_CURL_MAX_TIME_SECONDS || '5' }}
        run: |
          set -euo pipefail

          SYSTEMCTL_SUDO=sudo bash "$RELEASE/scripts/fieldgrid-deploy-health-gate.sh" \
            --environment "$TARGET" \
            --base-dir "$BASE_DIR" \
            --release-path "$RELEASE" \
            --expected-sha "$GITHUB_SHA" \
            --previous-release "${PREVIOUS_CURRENT:-}" \
            --rollback-on-failure \
            --restart-before-check \
            --shared-env "$BASE_DIR/shared/.env" \
            --rollback-env "$BASE_DIR/shared/.env.rollback-$GITHUB_SHA" \
            --evidence-file "$BASE_DIR/shared/deploy-health-${GITHUB_RUN_ID:-manual}-${GITHUB_SHA::7}.json"

          echo "FIELDGRID_HEALTH_EVIDENCE=$BASE_DIR/shared/deploy-health-${GITHUB_RUN_ID:-manual}-${GITHUB_SHA::7}.json" >> "$GITHUB_ENV"

      - name: Collect staging deploy diagnostics
        if: always() && env.TARGET == 'staging'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/fieldgrid-deploy-diagnostics"
          evidence="${FIELDGRID_HEALTH_EVIDENCE:-$BASE_DIR/shared/deploy-health-${GITHUB_RUN_ID:-manual}-${GITHUB_SHA::7}.json}"
          echo "Evidence path: $evidence"
          if [ -f "$evidence" ]; then
            cp "$evidence" "$GITHUB_WORKSPACE/fieldgrid-deploy-diagnostics/deploy-health.json"
            node -e 'const fs=require("fs"); const p=process.argv[1]; const e=JSON.parse(fs.readFileSync(p,"utf8")); console.log("Rollback status:", e.rollbackStatus||"unknown"); console.log("Failed checks:"); for (const c of e.checks||[]) if (c.status!=="pass") console.log(`- ${c.name}: ${c.detail}`);' "$evidence"
          else
            echo "No health evidence file found."
          fi
          principal_evidence="$RELEASE/artifacts/runtime-safety-harness/reports/w00-staging-principal-gate.json"
          if [ -f "$principal_evidence" ]; then
            cp "$principal_evidence" "$GITHUB_WORKSPACE/fieldgrid-deploy-diagnostics/w00-staging-principal-gate.json"
          fi
          if [ -L "$BASE_DIR/current" ]; then
            echo "Current symlink: $(readlink "$BASE_DIR/current")"
          else
            echo "Current symlink: <missing>"
          fi

      - name: Upload staging deploy diagnostics
        if: always() && env.TARGET == 'staging'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fieldgrid-staging-deploy-diagnostics-${{ github.run_id }}
          path: fieldgrid-deploy-diagnostics/
          if-no-files-found: ignore

      - name: Cleanup old releases
        run: |
          set -euo pipefail
          ls -1dt "$BASE_DIR/releases"/* 2>/dev/null | tail -n +6 | xargs -r rm -rf
