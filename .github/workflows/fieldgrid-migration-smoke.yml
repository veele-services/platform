name: Fieldgrid Migration Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/continue-wp1-implementation-from-pr-#516'

permissions:
  contents: read

concurrency:
  group: fieldgrid-migration-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-smoke:
    name: Migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact run head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Temporary development transport: tracked source/history only, no runner
      # configuration, credentials, databases or application data are included.
      - name: Export exact source for isolated local review
        run: git bundle create "$RUNNER_TEMP/fieldgrid-wp1-source.bundle" --all
      - name: Upload exact source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wp1-source-${{ github.sha }}
          path: ${{ runner.temp }}/fieldgrid-wp1-source.bundle
          retention-days: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up pinned unprivileged PostgreSQL 17
        run: scripts/fieldgrid-setup-postgresql17.sh

      - name: Check local migration-smoke runtime
        run: |
          set -euo pipefail
          postgres --version
          initdb --version
          pg_ctl --version
          createdb --version
          psql --version

      - name: Validate migration order
        run: pnpm fieldgrid:migration-order-check:check

      - name: Validate smoke contract
        run: pnpm fieldgrid:sprint7-migration-smoke:check

      - name: Run self-contained dual-target migration smoke
        run: node scripts/fieldgrid-local-migration-smoke.mjs --run --out artifacts/migration-smoke

      - name: Run current WP1 unit and contract tests
        run: node --test tests/fieldgrid-v1-wp1-*.test.mjs

      - name: Upload migration smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fieldgrid-migration-smoke-local-dual-target
          path: artifacts/migration-smoke/*.json
          if-no-files-found: warn
          retention-days: 1
