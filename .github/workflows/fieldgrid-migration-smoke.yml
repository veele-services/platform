name: Fieldgrid Migration Smoke

on:
  workflow_dispatch:

jobs:
  migration-smoke:
    name: Migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up pinned unprivileged PostgreSQL 17
        run: scripts/fieldgrid-setup-postgresql17.sh

      - name: Check local migration-smoke runtime
        run: |
          set -euo pipefail
          postgres --version
          initdb --version
          pg_ctl --version
          createdb --version
          psql --version

      - name: Validate migration order
        run: pnpm fieldgrid:migration-order-check:check

      - name: Validate smoke contract
        run: pnpm fieldgrid:sprint7-migration-smoke:check

      - name: Run self-contained dual-target migration smoke
        run: node scripts/fieldgrid-local-migration-smoke.mjs --run --out artifacts/migration-smoke

      - name: Upload migration smoke report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fieldgrid-migration-smoke-local-dual-target
          path: artifacts/migration-smoke/*.json
          if-no-files-found: warn
