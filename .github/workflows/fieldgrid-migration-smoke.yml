name: Fieldgrid Migration Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/continue-wp1-implementation-from-pr-#516'

permissions:
  contents: read

concurrency:
  group: fieldgrid-migration-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-smoke:
    if: github.event_name == 'workflow_dispatch'
    name: Migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/fieldgrid-setup-postgresql17.sh
      - run: pnpm fieldgrid:migration-order-check:check
      - run: pnpm fieldgrid:sprint7-migration-smoke:check
      - run: node scripts/fieldgrid-local-migration-smoke.mjs --run --out artifacts/migration-smoke
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fieldgrid-migration-smoke-local-dual-target
          path: artifacts/migration-smoke/*.json
          if-no-files-found: warn
          retention-days: 1

  wp1-postgresql:
    name: WP1 isolated PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fieldgrid_runtime_safety
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fieldgrid_runtime_safety"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fieldgrid_runtime_safety
      DB_SSL: 'false'
      PGSSLMODE: disable
      FIELDGRID_RUNTIME_SAFETY_ALLOW_RESET: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install complete committed migration chain
        run: pnpm fieldgrid:runtime-safety:setup
      - name: Inspect synthetic database catalog for reviewed reset scope
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -A -t -c "SELECT string_agg(quote_ident(tablename),',' ORDER BY tablename) FROM pg_tables WHERE schemaname='public'"
          psql "$DATABASE_URL" -X -A -t -c "SELECT c.relname || '|' || t.tgname || '|' || p.proname FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace JOIN pg_proc p ON p.oid=t.tgfoid WHERE NOT t.tgisinternal AND n.nspname='public' AND (t.tgtype & 8)=8 ORDER BY 1"
          psql "$DATABASE_URL" -X -A -t -c "SELECT table_name || '|' || column_name || '|' || data_type || '|' || coalesce(column_default,'') FROM information_schema.columns WHERE table_schema='public' AND table_name IN ('customers','objects','personnel','tenant_users','tenant_user_roles','tenants','organization_settings','assignment_tasks','payments') AND (is_nullable='NO' OR column_name IN ('provider_mode','provider_status')) ORDER BY table_name, ordinal_position"
      - name: Current WP1 tests
        run: node --test tests/fieldgrid-v1-wp1-*.test.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wp1-postgresql-${{ github.sha }}
          path: artifacts/runtime-safety-harness/reports/*.json
          if-no-files-found: warn
          retention-days: 1
