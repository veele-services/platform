name: Promotion Guard

on:
  pull_request:
    branches:
      - staging
      - production
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

env:
  # Fase 4: staging is no longer frozen; main -> staging is guarded by reproducible release signals below.
  STAGING_RECOVERY_FREEZE: "false"

jobs:
  enforce-release-flow:
    name: Enforce release flow
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source branch
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          base_branch="${GITHUB_BASE_REF}"
          head_branch="${GITHUB_HEAD_REF}"

          if [[ "$base_branch" == "staging" && "${STAGING_RECOVERY_FREEZE}" == "true" ]]; then
            echo "::error title=Staging temporarily frozen::main is the recovery source; staging will be updated from main later. Do not merge feature or recovery branches directly into staging."
            echo
            echo "Required recovery flow during freeze:"
            echo "  recovery/* or feature/* -> main"
            echo "  staging remains paused until main has a reproducible migration and test state"
            echo
            echo "Received:"
            echo "  $head_branch -> $base_branch"
            exit 1
          fi

          case "$base_branch" in
            staging)
              if [[ "$head_branch" == "main" ]]; then
                exit 0
              fi
              if [[ "$head_branch" == codex/promote-* ]]; then
                git fetch origin main --depth=1
                if git diff --quiet origin/main "$PR_HEAD_SHA"; then
                  echo "Verified resolved promotion branch has the exact main tree."
                  exit 0
                fi
                echo "::error title=Promotion branch differs from main::A resolved codex/promote-* staging PR must have the exact same tree as main."
                git diff --stat origin/main "$PR_HEAD_SHA"
                exit 1
              fi
              ;;
            production)
              if [[ "$head_branch" == "staging" || "$head_branch" == hotfix/* ]]; then
                exit 0
              fi
              ;;
          esac

          echo "::error title=Invalid promotion path::Pull requests into '$base_branch' must follow the documented release flow."
          echo "Allowed paths:"
          echo "  main -> staging"
          echo "  codex/promote-* -> staging (exact main tree only)"
          echo "  staging -> production"
          echo "  hotfix/* -> production"
          echo
          echo "Received:"
          echo "  $head_branch -> $base_branch"
          exit 1

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Fieldgrid release signals
        run: |
          pnpm fieldgrid:migration-order-check:check
          pnpm fieldgrid:test-layers:check
          pnpm fieldgrid:staging-promotion-gate:check

      - name: Block staging-only seed assets from production
        if: ${{ github.base_ref == 'production' }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "${GITHUB_BASE_REF}" --depth=1
          changed_files="$(git diff --name-only "origin/${GITHUB_BASE_REF}"...HEAD)"

          blocked="$(
            printf '%s\n' "$changed_files" | grep -E '^(\.github/workflows/seed-staging-demo\.yml|lib/db/src/seed/staging-demo\.ts|docs/development/staging-demo-seed\.md)$' || true
          )"

          if [[ -n "$blocked" ]]; then
            echo "::error title=Staging-only seed assets in production PR::Remove these files before promoting staging to production."
            printf '%s\n' "$blocked"
            exit 1
          fi
