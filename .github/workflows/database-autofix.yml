name: Database Autofix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veele-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate staging database
    if: github.ref_name == 'staging'
    runs-on: [self-hosted, linux, x64, veele]
    timeout-minutes: 30
    environment: staging

    env:
      TARGET_ENVIRONMENT: staging
      EXPECTED_SUPABASE_PROJECT_REF: olyfmekyqozxrbrwwszu
      APP_ENV: staging
      APP_URL: ${{ vars.APP_URL }}
      DATABASE_URL: ${{ secrets.FIELDGRID_RUNTIME_DATABASE_URL }}
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "true"
      PGSSLMODE: verify-full
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned Supabase database root certificate
        env:
          FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64: ${{ secrets.FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64 }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/fieldgrid-supabase-root-${GITHUB_RUN_ID}-${GITHUB_JOB}.crt"
          node scripts/fieldgrid-database-root-cert.mjs \
            --install-from-env FIELDGRID_DATABASE_SSL_ROOT_CERT_BASE64 \
            --out "$certificate_path"
          printf 'FIELDGRID_DATABASE_SSL_ROOT_CERT=%s\n' "$certificate_path" >> "$GITHUB_ENV"

      - name: Check runtime
        shell: bash
        run: |
          set -euo pipefail
          node -v
          pnpm -v

      - name: Validate staging database environment
        shell: bash
        env:
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "staging" ]; then
            echo "::error::Database Autofix must be dispatched from the staging branch."
            exit 1
          fi

          if [ "${TARGET_ENVIRONMENT}" != "staging" ] || [ "${APP_ENV}" != "staging" ]; then
            echo "::error::Database Autofix is restricted to the staging environment."
            exit 1
          fi

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL is not configured for the staging GitHub environment."
            exit 1
          fi

          if [ -z "${FIELDGRID_MIGRATION_DATABASE_URL:-}" ]; then
            echo "::error::FIELDGRID_MIGRATION_DATABASE_URL is not configured for the staging GitHub environment."
            exit 1
          fi

          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL is not configured for the staging GitHub environment."
            exit 1
          fi

          node scripts/fieldgrid-environment-isolation-preflight.mjs \
            --validate \
            --require-migration-database

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Run database migrations
        env:
          FIELDGRID_MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          pnpm run db:migrate
