name: Database Autofix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veele-staging
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate staging database
    if: github.ref_name == 'staging'
    runs-on: [self-hosted, linux, x64, veele]
    timeout-minutes: 30
    environment: staging

    env:
      TARGET_ENVIRONMENT: staging
      EXPECTED_SUPABASE_PROJECT_REF: olyfmekyqozxrbrwwszu
      APP_ENV: staging
      APP_URL: ${{ vars.APP_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check runtime
        shell: bash
        run: |
          set -euo pipefail
          node -v
          pnpm -v

      - name: Validate staging database environment
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "staging" ]; then
            echo "::error::Database Autofix must be dispatched from the staging branch."
            exit 1
          fi

          if [ "${TARGET_ENVIRONMENT}" != "staging" ] || [ "${APP_ENV}" != "staging" ]; then
            echo "::error::Database Autofix is restricted to the staging environment."
            exit 1
          fi

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL is not configured for the staging GitHub environment."
            exit 1
          fi

          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL is not configured for the staging GitHub environment."
            exit 1
          fi

          node scripts/fieldgrid-environment-isolation-preflight.mjs --validate

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prod=false

      - name: Run database migrations
        run: |
          set -euo pipefail
          pnpm run db:migrate
