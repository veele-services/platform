name: Inspect or repair explicit staging tenant integrations
on:
  workflow_dispatch:
    inputs:
      tenant_slug:
        description: Explicit active tenant hostname slug
        required: true
        type: string
      operation:
        description: Inspect or deliberately connect Mollie test and reconcile exact addresses
        required: true
        type: choice
        options: [inspect, repair, acceptance]
permissions:
  contents: read
concurrency:
  group: fieldgrid-staging
  cancel-in-progress: false
jobs:
  integrations:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 20
    env:
      DEPLOY_TARGET: staging
      APP_ENV: development
      APP_URL: ${{ vars.APP_URL }}
      EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.EXPECTED_SUPABASE_PROJECT_REF }}
      FORBIDDEN_SUPABASE_PROJECT_REF: ${{ vars.FORBIDDEN_SUPABASE_PROJECT_REF }}
      TARGET_TENANT_SLUG: ${{ inputs.tenant_slug }}
      INTEGRATION_OPERATION: ${{ inputs.operation }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact explicit reviewed staging promotion
        run: |
          test "$(git rev-parse origin/staging)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check or repair only the explicitly requested tenant
        if: inputs.operation != 'acceptance'
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
        run: pnpm exec tsx --conditions=react-server scripts/staging-tenant-integrations.ts
      - name: Install isolated acceptance browser
        if: inputs.operation == 'acceptance'
        run: pnpm exec playwright install --with-deps chromium
      - name: Real Mollie test checkout with archived synthetic customer evidence
        if: inputs.operation == 'acceptance'
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MOLLIE_API_KEY: ${{ secrets.MOLLIE_API_KEY }}
        run: pnpm exec tsx --conditions=react-server scripts/staging-customer-payment-acceptance.ts
