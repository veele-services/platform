name: Bootstrap production platform administrator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldgrid-production-admin-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/production'
    # This one-shot job needs Supabase service credentials but no VPS access.
    # Keep those credentials off the persistent production runner.
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    env:
      DEPLOY_TARGET: production
      APP_ENV: production
      EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.EXPECTED_SUPABASE_PROJECT_REF }}
      FORBIDDEN_SUPABASE_PROJECT_REF: ${{ vars.FORBIDDEN_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.7.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the exact healthy production runtime
        run: node scripts/verify-production-healthcheck.mjs
      - name: Create the platform administrator without logging credentials
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIELDGRID_ADMIN_EMAIL: ${{ secrets.FIELDGRID_ADMIN_EMAIL }}
        run: pnpm exec tsx scripts/bootstrap-production-admin.ts
