name: Disposable Staging Rebuild Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disposable-rebuild-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VALIDATION_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  rebuild-contract-and-runtime:
    name: Disposable rebuild / guarded two-cycle PostgreSQL 17 proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fieldgrid_runtime_safety
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d fieldgrid_runtime_safety"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fieldgrid_runtime_safety
      DB_SSL: 'false'
      PGSSLMODE: disable
      FIELDGRID_RUNTIME_SAFETY_ALLOW_RESET: '1'
    steps:
      - name: Checkout exact head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.VALIDATION_SHA }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate deterministic safety behavior
        run: |
          node --check scripts/fieldgrid-disposable-staging-rebuild.mjs
          node --test tests/fieldgrid-disposable-staging-rebuild.test.mjs
          pnpm fieldgrid:migration-order-check:check
      - name: Prepare local provider shims and committed migrations
        run: pnpm fieldgrid:runtime-safety:setup
      - name: Exercise two real application rebuilds without live credentials
        run: node scripts/fieldgrid-disposable-staging-rebuild-ci.mjs
      - name: Upload non-sensitive rebuild proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disposable-rebuild-${{ env.VALIDATION_SHA }}
          path: artifacts/disposable-staging-rebuild-ci/result.json
          if-no-files-found: warn
          retention-days: 1
