    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: DB integration Tenant A/B lane
        run: pnpm fieldgrid:test:db-integration-tenant-ab

      - name: Teardown local runtime database
        if: always()
        run: pnpm fieldgrid:runtime-safety:teardown

      - name: Upload DB integration artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-safety-db-integration-tenant-ab
          path: |
            artifacts/runtime-safety-harness/**/*.json
            artifacts/runtime-safety-harness/**/*.log
          if-no-files-found: error

  rls-security:
    name: rls-security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fieldgrid_runtime_safety
