name: Runtime Entrypoint Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Runtime entrypoint inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect stale compact manifest
        run: pnpm fieldgrid:runtime-entrypoints:check

      - name: Upload full runtime entrypoint inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fieldgrid-runtime-entrypoint-inventory-full
          path: artifacts/runtime-entrypoints/fieldgrid-runtime-entrypoint-inventory.full.json
          if-no-files-found: error
