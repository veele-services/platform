name: Runtime Entrypoint Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Runtime entrypoint inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect stale compact manifest
        run: pnpm fieldgrid:runtime-entrypoints:check

      - name: Upload full runtime entrypoint inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldgrid-runtime-entrypoint-inventory-full
          path: artifacts/runtime-entrypoints/fieldgrid-runtime-entrypoint-inventory.full.json
          if-no-files-found: error
